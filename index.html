/* ═══════════════ FECHAS ═══════════════ */
function getMonday(d) {
  const date = new Date(d); const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  const r = new Date(date.setDate(diff)); r.setHours(0,0,0,0); return r;
}
function toISO(d) {
  const z = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return z.toISOString().split('T')[0];
}
function fmtDate(date) {
  const m = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${date.getDate()} de ${m[date.getMonth()]}`;
}
function dateOfDay(weekStart, dayName) {
  const d = new Date(weekStart); d.setDate(d.getDate() + ALL_DAYS.indexOf(dayName)); d.setHours(0,0,0,0); return d;
}
function todayDayName() { const t = new Date().getDay(); return ALL_DAYS[t === 0 ? 6 : t - 1]; }
function hhmm(ts) { const d = new Date(ts); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function toMin(h) { if (!h || !/^\d{1,2}:\d{2}$/.test(h)) return null; const [a,b] = h.split(':').map(Number); return a*60+b; }

/* Puntualidad */
const TOLERANCIA_MIN = 30;
function estadoTarea(horaAsignada, ts) {
  if (!ts) return 'pendiente';
  const asign = toMin(horaAsignada);
  if (asign === null) return 'hecha';
  const real = toMin(hhmm(ts));
  if (real === null) return 'hecha';
  return real <= asign + TOLERANCIA_MIN ? 'a_tiempo' : 'atrasada';
}

function getDB() {

  try {
    if (!window.firebase) return null;
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _db = firebase.database(); return _db;
  } catch { return null; }
}
function fbRef(path) { const db = getDB(); return db ? db.ref(path) : null; }
function fbSave(path, val) { const r = fbRef(path); if (r) { try { r.set(val === undefined ? null : val).catch(()=>{}); } catch {} } }
function fbOn(path, cb) {
  const r = fbRef(path); if (!r) { cb(null); return () => {}; }
  const h = r.on('value', s => cb(s.val()), () => cb(null));
  return () => { try { r.off('value', h); } catch {} };
}

/* ═══════════════ ROTACIÓN AUTOMÁTICA ═══════════════ */
function autoAssign(catalog, staff, days) {
  const out = {};
  days.forEach((day, di) => {
    out[day] = {};
    const people = staff.filter(s => !s.inactivo);
    if (!people.length) return;
    const breaks = catalog.filter(t => t.isBreak && (!t.days || t.days.includes(day)));
    const tasks  = catalog.filter(t => !t.isBreak && (!t.days || t.days.includes(day)));
    people.forEach(p => { out[day][p.id] = breaks.map(b => b.id); });
    tasks.forEach((t, ti) => { out[day][people[(ti + di) % people.length].id].push(t.id); });
  });
  return out;
}

function sortByTime(catalog, ids) {
  const byId = Object.fromEntries(catalog.map(t => [t.id, t]));
  return [...(ids || [])].filter(id => byId[id]).sort((a, b) => {
    const ma = toMin(byId[a].time), mb = toMin(byId[b].time);
    if (ma === null && mb === null) return 0;
    if (ma === null) return 1;
    if (mb === null) return -1;
    return ma - mb;
  });
}

/* ═══════════════ LOGIN POR PIN ═══════════════ */
const Login = ({ loc, staff, masterPin, onLogin, onBack }) => {
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  const L = LOCALES[loc];

  const tryLogin = (p) => {
    if (p === String(masterPin)) { onLogin('__master__'); return; }
    const person = staff.find(s => String(s.pin) === p);
    if (person) { onLogin(person.id); return; }
    setErr('PIN incorrecto'); setPin('');
    if (navigator.vibrate) navigator.vibrate(180);
  };
  const press = (d) => {
    if (pin.length >= 4) return;
    const np = pin + d; setPin(np); setErr('');
    if (np.length === 4) setTimeout(() => tryLogin(np), 120);
  };

  return (
    <div className="min-h-screen bg-[#0f0f0f] flex flex-col items-center justify-center px-6 py-8">
      <button onClick={onBack} className="absolute top-5 left-5 flex items-center gap-1.5 text-slate-600 hover:text-white text-[10px] font-black uppercase tracking-wider">
        <Icon name="back" size={14}/> Cambiar local
      </button>
      <img src="logo.png" alt="Black Chicken" className="w-20 h-20 object-contain mb-3 opacity-90"/>
      <h1 className="text-lg font-black uppercase tracking-tight text-white">{L.name}</h1>
      <p className="text-[10px] text-slate-600 mb-7">{L.dir}</p>

      <div className="flex gap-3 mb-2">
        {[0,1,2,3].map(i => (
          <div key={i} className={`w-4 h-4 rounded-full border-2 transition-all ${pin.length > i ? 'bg-[#D4A843] border-[#D4A843]' : 'border-white/20'}`}/>
        ))}
      </div>
      <p className={`text-[11px] font-bold h-5 mb-4 ${err ? 'text-rose-400' : 'text-slate-600'}`}>{err || 'Ingresa tu PIN'}</p>

      <div className="grid grid-cols-3 gap-3 w-full max-w-[250px]">
        {['1','2','3','4','5','6','7','8','9'].map(d => (
          <button key={d} onClick={() => press(d)}
            className="aspect-square rounded-2xl bg-[#1a1a1a] border border-[#2a2a2a] text-white text-2xl font-bold active:bg-[#D4A843] active:text-black transition-colors">{d}</button>
        ))}
        <button onClick={() => { setPin(''); setErr(''); }}
          className="aspect-square rounded-2xl border border-[#2a2a2a] text-slate-500 text-[10px] font-black uppercase active:bg-white/5">Borrar</button>
        <button onClick={() => press('0')}
          className="aspect-square rounded-2xl bg-[#1a1a1a] border border-[#2a2a2a] text-white text-2xl font-bold active:bg-[#D4A843] active:text-black transition-colors">0</button>
        <button onClick={() => setPin(p => p.slice(0,-1))}
          className="aspect-square rounded-2xl border border-[#2a2a2a] text-slate-500 active:bg-white/5 flex items-center justify-center"><Icon name="back" size={18}/></button>
      </div>
      <p className="text-[9px] text-slate-700 mt-7 uppercase tracking-widest text-center">Tu PIN es personal · identifica quién hizo cada tarea</p>
    </div>
  );
};

/* ═══════════════ CHECKLIST DEL TURNO ═══════════════ */
const TurnoCard = ({ person, catalog, taskIds, plog, psub, canCheck, onToggle, onSubmit, onUnsubmit, isAdmin }) => {
  const [confirming, setConfirming] = useState(false);
  const byId = Object.fromEntries(catalog.map(t => [t.id, t]));
  const ids = sortByTime(catalog, taskIds);
  const total = ids.length;
  const done = ids.filter(id => plog[id]).length;
  const prog = total ? Math.round(done / total * 100) : 0;
  const c = cc(person.color);
  const locked = !!psub && !isAdmin;

  return (
    <div className={`rounded-2xl border overflow-hidden ${c.bd} bg-[#131313] fade-in`}>
      <div className={`p-4 ${c.bg} border-b border-white/5`}>
        <div className="flex justify-between items-start gap-2">
          <div className="min-w-0">
            <p className="text-[9px] font-black uppercase tracking-wider text-slate-500">{person.role}</p>
            <h2 className={`text-lg font-black uppercase tracking-tight ${c.txt} truncate`}>{person.name}</h2>
            <p className="text-[10px] font-bold text-slate-500 flex items-center gap-1 mt-0.5"><Icon name="clock" size={11}/> {person.schedule}</p>
          </div>
          <div className="text-right shrink-0">
            <p className="text-2xl font-black text-white leading-none">{done}<span className="text-slate-600 text-base">/{total}</span></p>
            <p className="text-[9px] font-black uppercase text-slate-500 mt-0.5">tareas</p>
          </div>
        </div>
        <div className="w-full h-1.5 bg-white/5 rounded-full mt-3">
          <div className={`h-full rounded-full transition-all ${prog === 100 ? 'bg-emerald-500' : 'bg-[#D4A843]'}`} style={{width:`${prog}%`}}/>
        </div>
      </div>

      <div className="p-2 space-y-1.5">
        {ids.length === 0 && <p className="text-center text-[11px] text-slate-600 py-6 font-medium">Sin tareas asignadas este día.</p>}
        {ids.map(id => (
          <TaskRow key={id} task={byId[id]} ts={plog[id]} canCheck={canCheck} locked={locked} onToggle={() => onToggle(person.id, id)}/>
        ))}
      </div>

      {ids.length > 0 && (
        <div className="p-3 border-t border-white/5">
          {psub ? (
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 text-emerald-400">
                <Icon name="check" size={14}/>
                <span className="text-[10px] font-black uppercase tracking-wider">Turno enviado {hhmm(psub.ts)} · {psub.done}/{psub.total}</span>
              </div>
              {isAdmin && <button onClick={() => onUnsubmit(person.id)} className="text-[9px] font-black uppercase text-slate-500 hover:text-rose-400">Reabrir</button>}
            </div>
          ) : (
            <>
              {confirming && done < total && (
                <p className="text-[10px] font-bold text-amber-400 mb-2 text-center">
                  Te quedan {total - done} tareas sin marcar. Toca de nuevo para enviar igual.
                </p>
              )}
              <button disabled={!canCheck}
                onClick={() => {
                  if (done < total && !confirming) { setConfirming(true); return; }
                  onSubmit(person.id, done, total); setConfirming(false);
                }}
                className={`w-full flex items-center justify-center gap-2 py-3 rounded-xl font-black text-xs uppercase tracking-wider transition-all ${
                  !canCheck ? 'bg-white/5 text-slate-600'
                  : confirming && done < total ? 'bg-amber-500 text-black'
                  : 'bg-[#D4A843] text-black active:opacity-80'
                }`}>
                <Icon name="send" size={14}/> {confirming && done < total ? 'Confirmar envío' : 'Enviar turno'}
              </button>
            </>
          )}
        </div>
      )}
    </div>
  );
};

/* ═══════════════ ASIGNACIÓN SEMANAL ═══════════════ */
const SemanaView = ({ catalog, staff, days, assign, setAssign, weekStart, onAuto }) => {
  const [day, setDay] = useState(() => days.includes(todayDayName()) ? todayDayName() : days[0]);
  const [picker, setPicker] = useState(null);   /* staffId */
  const [copyTo, setCopyTo] = useState(false);
  const byId = Object.fromEntries(catalog.map(t => [t.id, t]));
  const dayAssign = (assign && assign[day]) || {};

  const setFor = (staffId, ids) => {
    const na = { ...(assign || {}) };
    na[day] = { ...(na[day] || {}) , [staffId]: ids };
    setAssign(na);
  };
  const removeTask = (staffId, taskId) => setFor(staffId, (dayAssign[staffId] || []).filter(x => x !== taskId));
  const addTask = (staffId, taskId) => {
    const cur = dayAssign[staffId] || [];
    if (cur.includes(taskId)) return;
    setFor(staffId, [...cur, taskId]);
  };
  const clearDay = () => { const na = { ...(assign || {}) }; na[day] = {}; setAssign(na); };
  const copyDayTo = (targets) => {
    const na = { ...(assign || {}) };
    targets.forEach(t => { na[t] = JSON.parse(JSON.stringify(dayAssign)); });
    setAssign(na); setCopyTo(false);
  };

  const availables = catalog.filter(t => !t.days || t.days.includes(day));
  const asignadasHoy = new Set(Object.values(dayAssign).flat());

  return (
    <div className="space-y-3 fade-in">
      {/* Selector de día */}
      <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
        {days.map(d => {
          const n = Object.values((assign && assign[d]) || {}).flat().length;
          return (
            <button key={d} onClick={() => setDay(d)}
              className={`flex flex-col items-center px-3 py-1.5 rounded-xl min-w-[54px] transition-all ${
                day === d ? 'bg-[#D4A843] text-black' : 'bg-[#1a1a1a] text-slate-400 border border-[#2a2a2a]'
              }`}>
              <span className="text-[10px] font-black uppercase">{DAY_LABELS[ALL_DAYS.indexOf(d)]}</span>
              <span className="text-[9px] font-bold opacity-70">{n}</span>
            </button>
          );
        })}
      </div>

      <div className="flex gap-2 flex-wrap">
        <button onClick={onAuto} className="flex items-center gap-1.5 bg-[#1a1a1a] border border-[#2a2a2a] text-slate-300 px-3 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider hover:border-[#D4A843]">
          <Icon name="refresh" size={12}/> Auto-rotar semana
        </button>
        <button onClick={() => setCopyTo(true)} className="flex items-center gap-1.5 bg-[#1a1a1a] border border-[#2a2a2a] text-slate-300 px-3 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider hover:border-[#D4A843]">
          <Icon name="copy" size={12}/> Copiar día
        </button>
        <button onClick={clearDay} className="flex items-center gap-1.5 bg-[#1a1a1a] border border-[#2a2a2a] text-slate-500 px-3 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider hover:border-rose-500 hover:text-rose-400">
          <Icon name="trash" size={12}/> Limpiar
        </button>
      </div>

      {/* Tareas del día sin asignar */}
      {availables.filter(t => !asignadasHoy.has(t.id)).length > 0 && (
        <div className="bg-amber-500/8 border border-amber-500/25 rounded-xl p-3">
          <p className="text-[9px] font-black uppercase tracking-wider text-amber-400 mb-2 flex items-center gap-1.5">
            <Icon name="alert" size={12}/> Sin asignar este día
          </p>
          <div className="flex flex-wrap gap-1.5">
            {availables.filter(t => !asignadasHoy.has(t.id)).map(t => (
              <span key={t.id} className="text-[10px] font-bold bg-white/5 text-slate-300 px-2 py-1 rounded-lg">{t.name}</span>
            ))}
          </div>
        </div>
      )}

      {/* Tarjetas por persona */}
      {staff.map(p => {
        const c = cc(p.color);
        const ids = sortByTime(catalog, dayAssign[p.id]);
        return (
          <div key={p.id} className={`rounded-2xl border ${c.bd} bg-[#141414] overflow-hidden`}>
            <div className={`px-4 py-2.5 ${c.bg} border-b border-white/5 flex justify-between items-center`}>
              <div className="flex items-center gap-2 min-w-0">
                <div className={`w-2 h-2 rounded-full ${c.dot}`}/>
                <span className={`text-sm font-black uppercase tracking-tight ${c.txt} truncate`}>{p.name}</span>
                <span className="text-[9px] font-bold text-slate-600 shrink-0">{p.schedule}</span>
              </div>
              <span className="text-[10px] font-black text-slate-500 shrink-0">{ids.length}</span>
            </div>
            <div className="p-2.5 flex flex-wrap gap-1.5">
              {ids.map(id => {
                const t = byId[id];
                return (
                  <button key={id} onClick={() => removeTask(p.id, id)}
                    className={`flex items-center gap-1.5 text-[10px] font-bold px-2 py-1.5 rounded-lg border transition-all ${
                      t.isBreak ? 'bg-orange-500/10 border-orange-500/25 text-orange-300'
                      : 'bg-[#1a1a1a] border-[#2a2a2a] text-slate-300 hover:border-rose-500/50 hover:text-rose-400'
                    }`}>
                    <span className="gold font-black">{t.time}</span>
                    <span className="truncate max-w-[150px]">{t.name}</span>
                    <Icon name="x" size={10}/>
                  </button>
                );
              })}
              <button onClick={() => setPicker(p.id)}
                className="flex items-center gap-1 text-[10px] font-black uppercase px-2.5 py-1.5 rounded-lg border border-dashed border-[#3a3a3a] text-slate-500 hover:border-[#D4A843] hover:text-[#D4A843]">
                <Icon name="plus" size={11}/> Agregar
              </button>
            </div>
          </div>
        );
      })}

      {picker && (
        <Sheet title={`Agregar tarea · ${staff.find(s => s.id === picker)?.name || ''}`} onClose={() => setPicker(null)}>
          <p className="text-[10px] text-slate-500 mb-3 font-medium">
            {DAY_FULL[ALL_DAYS.indexOf(day)]} · toca una tarea para asignarla
          </p>
          <div className="space-y-1.5">
            {availables.map(t => {
              const yaSuya = (dayAssign[picker] || []).includes(t.id);
              const deOtro = !yaSuya && Object.entries(dayAssign).find(([sid, arr]) => sid !== picker && (arr || []).includes(t.id));
              return (
                <button key={t.id} disabled={yaSuya} onClick={() => { addTask(picker, t.id); setPicker(null); }}
                  className={`w-full flex items-center gap-3 p-3 rounded-xl border text-left transition-all ${
                    yaSuya ? 'bg-emerald-500/10 border-emerald-500/25 opacity-60'
                    : 'bg-[#1a1a1a] border-[#2a2a2a] hover:border-[#D4A843]'
                  }`}>
                  <div className="p-1.5 rounded-lg bg-white/5 text-slate-300"><Icon name={t.icon} size={16}/></div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-bold text-white truncate">{t.name}</p>
                    <p className="text-[9px] font-bold text-slate-500">
                      {t.time}{deOtro ? ` · ya asignada a ${staff.find(s => s.id === deOtro[0])?.name || '?'}` : ''}
                    </p>
                  </div>
                  {yaSuya && <Icon name="check" size={16}/>}
                </button>
              );
            })}
          </div>
        </Sheet>
      )}

      {copyTo && (
        <Sheet title={`Copiar ${DAY_FULL[ALL_DAYS.indexOf(day)]} a…`} onClose={() => setCopyTo(false)}>
          <div className="space-y-1.5">
            {days.filter(d => d !== day).map(d => (
              <button key={d} onClick={() => copyDayTo([d])}
                className="w-full p-3 rounded-xl bg-[#1a1a1a] border border-[#2a2a2a] text-left text-sm font-bold text-white hover:border-[#D4A843]">
                {DAY_FULL[ALL_DAYS.indexOf(d)]}
              </button>
            ))}
            <button onClick={() => copyDayTo(days.filter(d => d !== day))}
              className="w-full p-3 rounded-xl bg-[#D4A843] text-black text-sm font-black uppercase tracking-wider">
              Todos los demás días
            </button>
          </div>
          <p className="text-[10px] text-amber-400/80 mt-3 font-medium">
            Ojo: las tareas de día fijo (ej. viernes) se copian igual. Revisa después.
          </p>
        </Sheet>
      )}
    </div>
  );
};

                {t.days
                  ? <span className="text-[8px] font-black bg-purple-500/20 text-purple-300 px-1.5 py-0.5 rounded uppercase">Solo {t.days.map(d => DAY_LABELS[ALL_DAYS.indexOf(d)]).join('/')}</span>
                  : <span className="text-[8px] font-black bg-emerald-500/15 text-emerald-400 px-1.5 py-0.5 rounded uppercase">Todos los días</span>}
                {t.isBreak && <span className="text-[8px] font-black bg-orange-500/20 text-orange-300 px-1.5 py-0.5 rounded uppercase">Descanso</span>}
              </div>
            </div>
            <Icon name="settings" size={14}/>
          </button>
        ))}
      </div>

      {edit && <TareaEditor t={edit} days={days} onSave={save} onDelete={del} onClose={() => setEdit(null)}
        existe={catalog.some(x => x.id === edit.id)}/>}
    </div>
  );
};

const TareaEditor = ({ t, days, onSave, onDelete, onClose, existe }) => {
  const [f, setF] = useState(t);
  const up = (k, v) => setF(p => ({...p, [k]: v}));
  const toggleDay = (d) => {
    const cur = f.days || [];
    const nd = cur.includes(d) ? cur.filter(x => x !== d) : [...cur, d].sort((a,b) => ALL_DAYS.indexOf(a) - ALL_DAYS.indexOf(b));
    up('days', nd.length ? nd : null);
  };
  return (
    <Sheet title={existe ? 'Editar tarea' : 'Nueva tarea'} onClose={onClose}>
      <Fld label="Nombre">
        <input className={inputCls} value={f.name} onChange={e => up('name', e.target.value)} placeholder="Ej: Limpiar ventanales"/>
      </Fld>
      <div className="grid grid-cols-2 gap-3">
        <Fld label="Hora asignada">
          <input className={inputCls} value={f.time} onChange={e => up('time', e.target.value)} placeholder="15:00 o cierre"/>
        </Fld>
        <Fld label="Prioridad">
          <select className={inputCls} value={f.priority} onChange={e => up('priority', e.target.value)}>
            <option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option>
          </select>
        </Fld>
      </div>
      <Fld label="Días en que aplica">
        <div className="flex gap-1.5 flex-wrap">
          <button onClick={() => up('days', null)}
            className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase ${!f.days ? 'bg-[#D4A843] text-black' : 'bg-[#1a1a1a] text-slate-500 border border-[#2a2a2a]'}`}>
            Todos
          </button>
          {days.map(d => (
            <button key={d} onClick={() => toggleDay(d)}
              className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase ${
                f.days?.includes(d) ? 'bg-purple-500 text-white' : 'bg-[#1a1a1a] text-slate-500 border border-[#2a2a2a]'
              }`}>{DAY_LABELS[ALL_DAYS.indexOf(d)]}</button>
          ))}
        </div>
      </Fld>
      <Fld label="Ícono">
        <div className="flex gap-1.5 flex-wrap">
          {ICON_NAMES.map(n => (
            <button key={n} onClick={() => up('icon', n)}
              className={`p-2 rounded-lg border ${f.icon === n ? 'bg-[#D4A843] text-black border-[#D4A843]' : 'bg-[#1a1a1a] text-slate-400 border-[#2a2a2a]'}`}>
              <Icon name={n} size={16}/>
            </button>
          ))}
        </div>
      </Fld>
      <Fld label="Tipo">
        <button onClick={() => up('isBreak', !f.isBreak)}
          className={`w-full p-3 rounded-xl border text-left text-sm font-bold ${
            f.isBreak ? 'bg-orange-500/10 border-orange-500/30 text-orange-300' : 'bg-[#1a1a1a] border-[#2a2a2a] text-slate-400'
          }`}>
          {f.isBreak ? 'Es un descanso (se asigna a todos)' : 'Tarea normal'}
        </button>
      </Fld>
      <div className="flex gap-2 mt-5">
        {existe && (
          <button onClick={() => onDelete(f.id)} className="px-4 py-3 rounded-xl border border-rose-500/40 text-rose-400 text-[10px] font-black uppercase tracking-wider">
            <Icon name="trash" size={14}/>
          </button>
        )}
        <button onClick={() => onSave(f)} className="flex-1 py-3 rounded-xl bg-[#D4A843] text-black text-xs font-black uppercase tracking-wider">Guardar</button>

    </Sheet>

/* ═══════════════ CONTROL / CUMPLIMIENTO ═══════════════ */
const ControlView = ({ loc, catalog, staff, days, assign, weekStart, logs, subs }) => {
  const [scope, setScope] = useState('dia');
  const [copiado, setCopiado] = useState(false);
  const [day, setDay] = useState(() => days.includes(todayDayName()) ? todayDayName() : days[0]);
  const byId = Object.fromEntries(catalog.map(t => [t.id, t]));

  const filas = useMemo(() => {
    const dias = scope === 'dia' ? [day] : days;
    const out = [];
    dias.forEach(d => {
      const dISO = toISO(dateOfDay(weekStart, d));
      const dayAssign = (assign && assign[d]) || {};
      const dayLog = logs[dISO] || {};
      staff.forEach(p => {
        sortByTime(catalog, dayAssign[p.id]).forEach(tid => {
          const t = byId[tid]; if (!t) return;
          const ts = (dayLog[p.id] || {})[tid] || null;
          out.push({ dia:d, fecha:dISO, persona:p, tarea:t, ts, estado: estadoTarea(t.time, ts) });
        });
      });
    });
    return out;
  }, [scope, day, days, staff, catalog, assign, weekStart, logs]);

  const st = {
    total: filas.length,
    a_tiempo: filas.filter(f => f.estado === 'a_tiempo' || f.estado === 'hecha').length,
    atrasada: filas.filter(f => f.estado === 'atrasada').length,
    pendiente: filas.filter(f => f.estado === 'pendiente').length,
  };
  const pct = st.total ? Math.round((st.a_tiempo + st.atrasada) / st.total * 100) : 0;

  const exportCSV = () => {
    const head = 'Local;Fecha;Dia;Persona;Tarea;Hora asignada;Hora real;Estado';
    const rows = filas.map(f => [
      LOCALES[loc].name, f.fecha, DAY_FULL[ALL_DAYS.indexOf(f.dia)], f.persona.name,
      f.tarea.name, f.tarea.time, f.ts ? hhmm(f.ts) : '', EST_UI[f.estado].txt
    ].join(';'));
    const csv = '﻿' + [head, ...rows].join('\n');
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Tareas_${loc.toUpperCase()}_${scope === 'dia' ? toISO(dateOfDay(weekStart, day)) : 'semana_' + toISO(weekStart)}.csv`;
    a.click();
  };

  const copiarResumen = () => {
    const titulo = scope === 'dia'
      ? `${DAY_FULL[ALL_DAYS.indexOf(day)]} ${fmtDate(dateOfDay(weekStart, day))}`
      : `Semana del ${fmtDate(weekStart)}`;
    let txt = `*${LOCALES[loc].name} · Tareas de salón*\n${titulo}\nCumplimiento: ${pct}% (${st.a_tiempo + st.atrasada}/${st.total})\n`;
    staff.forEach(p => {
      const suyas = filas.filter(f => f.persona.id === p.id);
      if (!suyas.length) return;
      const ok = suyas.filter(f => f.estado !== 'pendiente').length;
      txt += `\n*${p.name}* — ${ok}/${suyas.length}`;
      const atr = suyas.filter(f => f.estado === 'atrasada');
      const pen = suyas.filter(f => f.estado === 'pendiente');
      if (atr.length) txt += `\n  Atrasadas: ${atr.map(f => `${f.tarea.name} (${hhmm(f.ts)} vs ${f.tarea.time})`).join(', ')}`;
      if (pen.length) txt += `\n  Sin hacer: ${pen.map(f => f.tarea.name).join(', ')}`;
    });
    try { navigator.clipboard?.writeText(txt); } catch {}
    setCopiado(true); setTimeout(() => setCopiado(false), 2200);
  };

  return (
    <div className="space-y-3 fade-in">
      <div className="flex gap-2">
        {[['dia','Día'],['semana','Semana']].map(([k,l]) => (
          <button key={k} onClick={() => setScope(k)}
            className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider ${
              scope === k ? 'bg-[#D4A843] text-black' : 'bg-[#1a1a1a] text-slate-400 border border-[#2a2a2a]'
            }`}>{l}</button>
        ))}
      </div>

      {scope === 'dia' && (
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
          {days.map(d => (
            <button key={d} onClick={() => setDay(d)}
              className={`px-3 py-1.5 rounded-xl text-[10px] font-black uppercase min-w-[48px] ${
                day === d ? 'bg-white text-black' : 'bg-[#1a1a1a] text-slate-400 border border-[#2a2a2a]'
              }`}>{DAY_LABELS[ALL_DAYS.indexOf(d)]}</button>
          ))}
        </div>
      )}

      <div className="grid grid-cols-4 gap-2">
        {[['Asignadas',st.total,'text-white'],['A tiempo',st.a_tiempo,'text-emerald-400'],
          ['Atrasadas',st.atrasada,'text-amber-400'],['Sin hacer',st.pendiente,'text-rose-400']].map(([l,v,c]) => (
          <div key={l} className="bg-[#151515] border border-[#242424] rounded-xl p-2.5 text-center">
            <p className={`text-xl font-black ${c}`}>{v}</p>
            <p className="text-[8px] font-black uppercase tracking-wider text-slate-500 mt-0.5">{l}</p>
          </div>
        ))}
      </div>

      <div className="bg-[#151515] border border-[#242424] rounded-xl p-3">
        <div className="flex justify-between items-center mb-2">
          <span className="text-[10px] font-black uppercase tracking-wider text-slate-400">Cumplimiento</span>
          <span className={`text-sm font-black ${pct >= 90 ? 'text-emerald-400' : pct >= 70 ? 'text-amber-400' : 'text-rose-400'}`}>{pct}%</span>
        </div>
        <div className="w-full h-2 bg-white/5 rounded-full">
          <div className={`h-full rounded-full ${pct >= 90 ? 'bg-emerald-500' : pct >= 70 ? 'bg-amber-500' : 'bg-rose-500'}`} style={{width:`${pct}%`}}/>
        </div>
      </div>

      <div className="flex gap-2">
        <button onClick={copiarResumen} className={`flex-1 flex items-center justify-center gap-1.5 border px-3 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider ${
          copiado ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-400' : 'bg-[#1a1a1a] border-[#2a2a2a] text-slate-300 hover:border-[#D4A843]'
        }`}>
          <Icon name={copiado ? 'check' : 'copy'} size={12}/> {copiado ? 'Copiado' : 'Copiar resumen'}
        </button>
        <button onClick={exportCSV} className="flex-1 flex items-center justify-center gap-1.5 bg-[#1a1a1a] border border-[#2a2a2a] text-slate-300 px-3 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider hover:border-[#D4A843]">
          <Icon name="download" size={12}/> Exportar CSV
        </button>
      </div>

      {/* Detalle por persona */}
      {staff.map(p => {
        const suyas = filas.filter(f => f.persona.id === p.id);
        if (!suyas.length) return null;
        const c = cc(p.color);
        const dISO = toISO(dateOfDay(weekStart, day));
        const sub = scope === 'dia' ? ((subs[dISO] || {})[p.id] || null) : null;
        const ok = suyas.filter(f => f.estado !== 'pendiente').length;
        return (
          <div key={p.id} className={`rounded-2xl border ${c.bd} bg-[#131313] overflow-hidden`}>
            <div className={`px-4 py-2.5 ${c.bg} border-b border-white/5 flex justify-between items-center gap-2`}>
              <div className="flex items-center gap-2 min-w-0">
                <div className={`w-2 h-2 rounded-full ${c.dot}`}/>
                <span className={`text-sm font-black uppercase tracking-tight ${c.txt} truncate`}>{p.name}</span>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                {scope === 'dia' && (
                  <span className={`text-[8px] font-black px-1.5 py-0.5 rounded uppercase border ${
                    sub ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30' : 'bg-white/5 text-slate-500 border-white/10'
                  }`}>{sub ? `Enviado ${hhmm(sub.ts)}` : 'Sin enviar'}</span>
                )}
                <span className="text-[10px] font-black text-slate-400">{ok}/{suyas.length}</span>
              </div>
            </div>
            <div className="divide-y divide-white/5">
              {suyas.map((f, i) => (
                <div key={i} className="flex items-center gap-2 px-3 py-2">
                  {scope === 'semana' && <span className="text-[8px] font-black text-slate-600 w-7 shrink-0 uppercase">{DAY_LABELS[ALL_DAYS.indexOf(f.dia)]}</span>}
                  <span className="text-[10px] font-black gold w-10 shrink-0">{f.tarea.time}</span>
                  <span className="text-[11px] font-bold text-slate-300 flex-1 min-w-0 truncate">{f.tarea.name}</span>
                  <span className="text-[10px] font-black text-white w-9 text-right shrink-0">{f.ts ? hhmm(f.ts) : '—'}</span>
                  <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border uppercase shrink-0 w-[62px] text-center ${EST_UI[f.estado].cls}`}>
                    {EST_UI[f.estado].txt}
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {filas.length === 0 && <p className="text-center text-[11px] text-slate-600 py-8 font-medium">No hay tareas asignadas en este período.</p>}
    </div>
  );
};

/* ═══════════════ APP ═══════════════ */
const App = () => {
  const [loc, setLoc]         = useState(() => localStorage.getItem('bc_loc') || null);
  const [session, setSession] = useState(null);
  const [ready, setReady]     = useState(false);

  const [staff, setStaffRaw]     = useState([]);
  const [catalog, setCatalogRaw] = useState([]);
  const [days, setDaysRaw]       = useState([]);
  const [savedAssign, setSavedAssign] = useState(undefined);
  const [masterPin, setMasterPinRaw]  = useState(DEFAULT_MASTER_PIN);
  const [logs, setLogs] = useState({});
  const [subs, setSubs] = useState({});

  const [weekStart, setWeekStart] = useState(() => getMonday(new Date()));
  const [tab, setTab] = useState('turno');
  const [showCfg, setShowCfg] = useState(false);

  const weekISO = toISO(weekStart);
  const L = loc ? LOCALES[loc] : null;

  /* Sesión guardada por local */
  useEffect(() => {
    if (!loc) { setSession(null); return; }
    setSession(localStorage.getItem(loc + '_session') || null);
  }, [loc]);

  /* Suscripciones base del local */
  useEffect(() => {
    if (!loc) return;
    setReady(false);
    const offs = [];
    let pend = 4;
    const done = () => { if (--pend <= 0) setReady(true); };
    offs.push(fbOn(loc + '/staffV2',   v => { setStaffRaw(Array.isArray(v) && v.length ? v : LOCALES[loc].staff); done(); }));
    offs.push(fbOn(loc + '/catalog',   v => { setCatalogRaw(Array.isArray(v) && v.length ? v : defaultCatalog(loc)); done(); }));
    offs.push(fbOn(loc + '/activeDays',v => { setDaysRaw(Array.isArray(v) && v.length ? v : ALL_DAYS.slice(0, LOCALES[loc].openDays)); done(); }));
    offs.push(fbOn('config/masterPin', v => { setMasterPinRaw(v || DEFAULT_MASTER_PIN); done(); }));
    const t = setTimeout(() => setReady(true), 3500);
    return () => { offs.forEach(f => f()); clearTimeout(t); };
  }, [loc]);

  /* Asignación de la semana */
  useEffect(() => {
    if (!loc) return;
    setSavedAssign(undefined);
    return fbOn(`${loc}/assign/${weekISO}`, v => setSavedAssign(v || null));
  }, [loc, weekISO]);

  /* Registros y envíos de los 7 días de la semana */
  useEffect(() => {
    if (!loc) return;
    const offs = [];
    ALL_DAYS.forEach(d => {
      const iso = toISO(dateOfDay(weekStart, d));
      offs.push(fbOn(`${loc}/log/${iso}`,    v => setLogs(p => ({...p, [iso]: v || {}}))));
      offs.push(fbOn(`${loc}/submit/${iso}`, v => setSubs(p => ({...p, [iso]: v || {}}))));
    });
    return () => offs.forEach(f => f());
  }, [loc, weekISO]);

  /* Escrituras */
  const setStaff     = (v) => { setStaffRaw(v);   fbSave(loc + '/staffV2', v); };
  const setCatalog   = (v) => { setCatalogRaw(v); fbSave(loc + '/catalog', v); };
  const setDays      = (v) => { setDaysRaw(v);    fbSave(loc + '/activeDays', v); };
  const setMasterPin = (v) => { setMasterPinRaw(v); if (v && v.length === 4) fbSave('config/masterPin', v); };

  /* Checklist dinámico: si la semana no tiene asignación guardada, se genera por rotación */
  const assign = useMemo(() => {
    if (savedAssign && Object.keys(savedAssign).length) return savedAssign;
    if (!catalog.length || !staff.length || !days.length) return {};
    return autoAssign(catalog, staff, days);
  }, [savedAssign, catalog, staff, days]);
  const setAssign = (v) => { setSavedAssign(v); fbSave(`${loc}/assign/${weekISO}`, v); };

  /* Identidad */
  const isMaster = session === '__master__';
  const me       = isMaster ? null : staff.find(s => s.id === session);
  const isAdmin  = isMaster || !!me?.isAdmin;

  /* Sesión inválida (PIN borrado) → salir */
  useEffect(() => {
    if (ready && session && !isMaster && !me) doLogout();
  }, [ready, session, me, isMaster]);

  const login = (id) => { setSession(id); localStorage.setItem(loc + '_session', id); setTab('turno'); };
  const doLogout = () => { setSession(null); localStorage.removeItem(loc + '_session'); };
  const pickLocal = (id) => { setLoc(id); localStorage.setItem('bc_loc', id); };
  const changeLocal = () => { doLogout(); setLoc(null); localStorage.removeItem('bc_loc'); };

  /* Día visible */
  const hoy = todayDayName();
  const esSemanaActual = weekISO === toISO(getMonday(new Date()));
  const [dayView, setDayView] = useState(hoy);
  useEffect(() => { if (days.length && !days.includes(dayView)) setDayView(days[0]); }, [days]);

  const dISO = useMemo(() => toISO(dateOfDay(weekStart, dayView)), [weekStart, dayView]);
  const dayLog = logs[dISO] || {};
  const daySub = subs[dISO] || {};
  const esHoy = esSemanaActual && dayView === hoy;

  const toggle = useCallback((staffId, taskId) => {
    const cur = (logs[dISO] || {})[staffId] || {};
    const val = cur[taskId] ? null : Date.now();
    setLogs(p => {
      const nd = {...(p[dISO] || {})};
      const ns = {...(nd[staffId] || {})};
      if (val) ns[taskId] = val; else delete ns[taskId];
      nd[staffId] = ns; return {...p, [dISO]: nd};
    });
    fbSave(`${loc}/log/${dISO}/${staffId}/${taskId}`, val);
  }, [logs, dISO, loc]);

  const submit = (staffId, done, total) => {
    const rec = { ts: Date.now(), done, total, by: session };
    setSubs(p => ({...p, [dISO]: {...(p[dISO] || {}), [staffId]: rec}}));
    fbSave(`${loc}/submit/${dISO}/${staffId}`, rec);
  };
  const unsubmit = (staffId) => {
    setSubs(p => { const nd = {...(p[dISO] || {})}; delete nd[staffId]; return {...p, [dISO]: nd}; });
    fbSave(`${loc}/submit/${dISO}/${staffId}`, null);
  };

  /* ── Pantallas de entrada ── */
  if (!loc) return <LocalPicker onPick={pickLocal}/>;
  if (!ready) return (
    <div className="min-h-screen bg-[#0f0f0f] flex flex-col items-center justify-center gap-4">
      <img src="logo.png" className="w-20 h-20 object-contain opacity-40 animate-pulse" alt=""/>
      <p className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-600">Cargando</p>
    </div>
  );
  if (!session) return <Login loc={loc} staff={staff} masterPin={masterPin} onLogin={login} onBack={changeLocal}/>;

  const TABS = isAdmin
    ? [['turno','Turnos','users'],['semana','Semana','grid'],['tareas','Tareas','list'],['control','Control','chart']]
    : [['turno','Mi checklist','checksq']];

  const visibles = isAdmin ? staff : (me ? [me] : []);

  return (
    <div className="min-h-screen bg-[#0f0f0f] text-white pb-28">
      {/* HEADER */}
      <header className="sticky top-0 z-40 bg-[#0f0f0f]/95 backdrop-blur border-b border-[#222] px-4 py-3">
        <div className="max-w-3xl mx-auto">
          <div className="flex justify-between items-center gap-2">
            <div className="flex items-center gap-2.5 min-w-0">
              <img src="logo.png" className="w-8 h-8 object-contain shrink-0" alt=""/>
              <div className="min-w-0">
                <h1 className="text-sm font-black uppercase tracking-tight leading-none truncate">{L.name}</h1>
                <p className="text-[9px] font-bold gold uppercase tracking-wider mt-0.5">
                  {isMaster ? 'Dueño' : me?.name}{isAdmin && !isMaster ? ' · Jefatura' : ''}
                </p>
              </div>
            </div>
            <div className="flex gap-1 shrink-0">
              {isAdmin && (
                <button onClick={() => setShowCfg(true)} className="p-2 rounded-lg text-slate-500 hover:text-white hover:bg-white/5"><Icon name="settings" size={17}/></button>
              )}
              <button onClick={changeLocal} className="p-2 rounded-lg text-slate-500 hover:text-white hover:bg-white/5" title="Cambiar local"><Icon name="home" size={17}/></button>
              <button onClick={doLogout} className="p-2 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-white/5"><Icon name="logout" size={17}/></button>
            </div>
          </div>

          {/* Navegación de semana */}
          <div className="flex items-center justify-between mt-2.5">
            <button onClick={() => { const d = new Date(weekStart); d.setDate(d.getDate()-7); setWeekStart(d); }}
              className="px-2 text-slate-600 hover:text-white text-lg font-bold">‹</button>
            <button onClick={() => setWeekStart(getMonday(new Date()))} className="flex items-center gap-1.5 text-slate-400 hover:text-white">
              <Icon name="calendar" size={12}/>
              <span className="text-[10px] font-black uppercase tracking-wider">Semana del {fmtDate(weekStart)}</span>
              {!esSemanaActual && <span className="text-[8px] font-black bg-amber-500/20 text-amber-400 px-1.5 py-0.5 rounded uppercase">Otra semana</span>}
            </button>
            <button onClick={() => { const d = new Date(weekStart); d.setDate(d.getDate()+7); setWeekStart(d); }}
              className="px-2 text-slate-600 hover:text-white text-lg font-bold">›</button>
          </div>

          {/* Días (solo en vista Turnos) */}
          {tab === 'turno' && (
            <div className="flex gap-1.5 overflow-x-auto no-scrollbar mt-2">
              {days.map(d => {
                const iso = toISO(dateOfDay(weekStart, d));
                const lg = logs[iso] || {};
                const asig = Object.values((assign && assign[d]) || {}).flat().length;
                const hechas = Object.values(lg).reduce((a, o) => a + Object.keys(o || {}).length, 0);
                const prog = asig ? Math.round(hechas / asig * 100) : 0;
                return (
                  <button key={d} onClick={() => setDayView(d)}
                    className={`flex flex-col items-center px-3 py-1.5 rounded-xl min-w-[52px] transition-all ${
                      dayView === d ? 'bg-white text-black' : 'bg-[#1a1a1a] text-slate-500 border border-[#2a2a2a]'
                    }`}>
                    <span className="text-[10px] font-black uppercase">{DAY_LABELS[ALL_DAYS.indexOf(d)]}</span>
                    <div className={`w-full h-0.5 rounded-full mt-1 ${dayView === d ? 'bg-black/20' : 'bg-white/10'}`}>
                      <div className={`h-full rounded-full ${dayView === d ? 'bg-black' : 'bg-[#D4A843]'}`} style={{width:`${prog}%`}}/>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </header>

      <main className="max-w-3xl mx-auto p-3 space-y-3">
        {tab === 'turno' && (
          <>
            <div className="flex items-center justify-between px-1">
              <p className="text-[10px] font-black uppercase tracking-wider text-slate-500">
                {DAY_FULL[ALL_DAYS.indexOf(dayView)]} {fmtDate(dateOfDay(weekStart, dayView))}
              </p>
              {!esHoy && <span className="text-[9px] font-black uppercase text-amber-400/80">Solo lectura · no es hoy</span>}
            </div>
            {visibles.map(p => (
              <TurnoCard key={p.id} person={p} catalog={catalog}
                taskIds={(assign[dayView] || {})[p.id]}
                plog={dayLog[p.id] || {}} psub={daySub[p.id] || null}
                canCheck={isAdmin || (esHoy && p.id === session)}
                isAdmin={isAdmin}
                onToggle={toggle} onSubmit={submit} onUnsubmit={unsubmit}/>
            ))}
          </>
        )}

        {tab === 'semana' && isAdmin && (
          <SemanaView catalog={catalog} staff={staff} days={days} assign={assign} setAssign={setAssign}
            weekStart={weekStart} onAuto={() => setAssign(autoAssign(catalog, staff, days))}/>
        )}
        {tab === 'tareas'  && isAdmin && <TareasView catalog={catalog} setCatalog={setCatalog} days={days}/>}
        {tab === 'control' && isAdmin && (
          <ControlView loc={loc} catalog={catalog} staff={staff} days={days} assign={assign}
            weekStart={weekStart} logs={logs} subs={subs}/>
        )}
      </main>

      {/* NAV INFERIOR */}
      {TABS.length > 1 && (
        <nav className="fixed bottom-0 inset-x-0 z-40 bg-[#141414]/95 backdrop-blur border-t border-[#222] px-2 py-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]">
          <div className="max-w-3xl mx-auto grid grid-cols-4 gap-1">
            {TABS.map(([k, label, ic]) => (
              <button key={k} onClick={() => setTab(k)}
                className={`flex flex-col items-center gap-1 py-2 rounded-xl transition-all ${
                  tab === k ? 'bg-[#D4A843] text-black' : 'text-slate-500'
                }`}>
                <Icon name={ic} size={17}/>
                <span className="text-[8px] font-black uppercase tracking-wider">{label}</span>
              </button>
            ))}
          </div>
        </nav>
      )}

      {showCfg && (
        <Sheet title="Configuración" onClose={() => setShowCfg(false)}>
          <ConfigView loc={loc} staff={staff} setStaff={setStaff} days={days} setDays={setDays}
            masterPin={masterPin} setMasterPin={setMasterPin} isMaster={isMaster}
            openDays={L.openDays}
            onResetCatalog={() => setCatalog(defaultCatalog(loc))}/>
        </Sheet>
      )}

      <footer className="mt-6 text-center opacity-25 pb-2">
        <p className="text-[8px] font-black uppercase tracking-[0.4em]">Black Chicken · Tareas de Salón 2026</p>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
