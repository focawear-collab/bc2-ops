/* âââââââââââââââââââ DATE UTILS âââââââââââââââââââ */
function getMonday(d) {
  const date = new Date(d); const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(date.setDate(diff));
}
function fmtDate(date) {
  const m = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${date.getDate()} de ${m[date.getMonth()]}`;
}
function getWeekDates(mon) { return DAY_FULL.map((n,i) => { const d = new Date(mon); d.setDate(d.getDate()+i); return `${n} ${fmtDate(d)}`; }); }
function toISODate(d) { return d.toISOString().split('T')[0]; }

/* âââââââââââââââââââ ROTATION ALGORITHM âââââââââââââââââââ */
function generateSchedule(staff, tasks, days) {
  const pts = staff.filter(s => !s.isFullTime);
  const fts = staff.filter(s => s.isFullTime);
  const svcTasks = tasks.filter(t => t.time !== 'cierre');
  const closeTasks = tasks.filter(t => t.time === 'cierre');
  const schedule = {};

  days.forEach((dayName, dayIdx) => {
    const dayBlocks = [];
    const rotated = [...svcTasks];
    // Rotate tasks based on day
    for (let r = 0; r < dayIdx; r++) rotated.push(rotated.shift());
    let ti = 0;

    // Part-timers
    pts.forEach((p) => {
      const tareas = [];
      tareas.push({ hora: p.schedule.split(' - ')[0], desc: 'Servicio en Salon', icon: 'user', isBreak: false, important: false });
      // 2 tasks per PT
      for (let t = 0; t < 2 && ti < rotated.length; t++, ti++) {
        const task = rotated[ti];
        tareas.push({ hora: task.time, desc: task.name, icon: task.icon, isBreak: false, important: task.priority === 'high', taskId: task.id });
      }
      tareas.push({ hora: p.schedule.split(' - ')[1], desc: 'FIN TURNO / COLACION', icon: 'coffee', isBreak: true, important: false });
      dayBlocks.push({ usuario: p.id, isLeader: false, tareas });
    });

    // Full-timers
    fts.forEach((p) => {
      const tareas = [];
      tareas.push({ hora: p.schedule.split(' - ')[0], desc: 'Apertura y Organizacion', icon: 'monitor', isBreak: false, important: false });
      tareas.push({ hora: '12:00', desc: 'Servicio en Salon', icon: 'user', isBreak: false, important: false });
      // Remaining service tasks
      while (ti < rotated.length) {
        const task = rotated[ti]; ti++;
        tareas.push({ hora: task.time, desc: task.name, icon: task.icon, isBreak: false, important: task.priority === 'high', taskId: task.id });
      }
      // Closing tasks
      closeTasks.forEach(task => {
        tareas.push({ hora: 'Cierre', desc: task.name, icon: task.icon, isBreak: false, important: false, taskId: task.id });
      });
      tareas.push({ hora: '16:30', desc: 'COLACION', icon: 'coffee', isBreak: true, important: false });
      tareas.push({ hora: p.schedule.split(' - ')[1], desc: 'Cierre de Turno', icon: 'checksq', isBreak: false, important: false });
      dayBlocks.push({ usuario: p.id, isLeader: true, tareas });
    });

    dayBlocks.sort((a, b) => (b.isLeader ? 1 : 0) - (a.isLeader ? 1 : 0));
    schedule[dayName] = dayBlocks;
  });
  return schedule;
}

/* âââââââââââââââââââ SMART PRIORITIES âââââââââââââââââââ */
function getPriorities(dayName, idx, sched, staff) {
  const day = sched[dayName]; if (!day) return [];
  const p = [];
  if (idx === 0) p.push('Limpieza profunda post-fin de semana: revisar salon, banos y cocina antes de abrir.');
  if (idx >= 4) p.push('Dia de alto trafico: preparar mise en place extra y confirmar stock de insumos criticos.');
  const hp = [];
  day.forEach(b => b.tareas.filter(t => t.important).forEach(t => {
    const who = staff.find(s => s.id === b.usuario);
    hp.push(`${t.desc} (${who?.name || '?'})`);
  }));
  if (hp.length) p.push(`Tareas criticas: ${hp.join(', ')}. Supervisar antes de las 15:30.`);
  p.push('Verificar FIFO en bodega y visicooler. Revisar fechas de vencimiento de salsas y bebestibles.');
  if (idx % 2 === 0) p.push('Revisar limpieza de ventanales y banquitos del area exterior.');
  else p.push('Verificar reposicion de cubiertos, servilletas y take away antes del rush.');
  return p.slice(0, 4);
}

function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

        <h2 className="text-lg font-black uppercase tracking-tight">Configuracion</h2>
        <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full"><Icon name="x" size={18}/></button>
      </div>
      <div className="p-4 space-y-5">
        {/* Week */}
        <div>
          <label className="text-[10px] font-black uppercase tracking-wider text-slate-400 mb-2 block">Semana</label>
          <input type="date" value={toISODate(weekStart)}
            onChange={e => setWeekStart(getMonday(new Date(e.target.value)))}
            className="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none"/>
        </div>
        {/* Days */}
        <div>
          <label className="text-[10px] font-black uppercase tracking-wider text-slate-400 mb-2 block">Dias Activos</label>
          <div className="flex gap-2 flex-wrap">
            {DAY_NAMES.map((d,i) => (
              <button key={d} onClick={() => {
                if (activeDays.includes(d)) { if (activeDays.length > 1) setActiveDays(activeDays.filter(x => x !== d)); }
                else { setActiveDays([...activeDays, d].sort((a,b) => DAY_NAMES.indexOf(a) - DAY_NAMES.indexOf(b))); }
              }} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${activeDays.includes(d) ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-400'}`}>
                {DAY_LABELS[i]}
              </button>
            ))}
          </div>
        </div>
        {/* Staff */}
        <div>
          <div className="flex justify-between items-center mb-2">
            <label className="text-[10px] font-black uppercase tracking-wider text-slate-400">Equipo</label>
            <button onClick={addStaff} className="flex items-center gap-1 text-[10px] font-bold text-blue-600"><Icon name="plus" size={12}/> Agregar</button>
          </div>
          <div className="space-y-2">
            {staff.map(p => (
              <div key={p.id} className="bg-slate-50 rounded-xl p-3 border border-slate-200">
                <div className="flex gap-2 items-center mb-2">
                  <div className={`w-3 h-3 rounded-full ${CC[p.color]?.dot || 'bg-slate-400'}`}/>
                  <input type="text" value={p.name} onChange={e => updateStaff(p.id,'name',e.target.value)}
                    className="flex-1 bg-transparent font-bold text-sm border-b border-transparent hover:border-slate-300 focus:border-blue-500 outline-none px-1"/>
                  <button onClick={() => removeStaff(p.id)} className="text-slate-300 hover:text-red-500"><Icon name="trash" size={14}/></button>
                </div>
                <div className="flex gap-2 items-center flex-wrap">
                  <input type="text" value={p.schedule} onChange={e => updateStaff(p.id,'schedule',e.target.value)}
                    className="flex-1 min-w-[120px] bg-white border border-slate-200 rounded-lg px-2 py-1 text-[11px] font-medium"/>
                  <select value={p.isFullTime?'full':'part'} onChange={e => updateStaff(p.id,'isFullTime',e.target.value==='full')}
                    className="bg-white border border-slate-200 rounded-lg px-2 py-1 text-[11px] font-medium">
                    <option value="full">Full-time</option><option value="part">Part-time</option>
                  </select>
                  <select value={p.color} onChange={e => updateStaff(p.id,'color',e.target.value)}
                    className="bg-white border border-slate-200 rounded-lg px-2 py-1 text-[11px] font-medium">
                    {COLORS.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>
            ))}
          </div>
        </div>
        {/* Regen */}
        <button onClick={regenerate}
          className="w-full flex items-center justify-center gap-2 bg-slate-900 text-white py-3 rounded-xl font-black text-xs uppercase tracking-wider hover:bg-slate-800 transition-colors">
          <Icon name="refresh" size={14}/> Regenerar Rotacion
        </button>
      </div>
    </div>
  </div>
);

/* âââââââââââââââââââ MAIN APP âââââââââââââââââââ */
const App = () => {
  const [staff, setStaff] = useState(() => loadJSON('bc2_staff', DEFAULT_STAFF));
  const [tasks] = useState(() => loadJSON('bc2_tasks', DEFAULT_TASKS));
  const [weekStart, setWeekStart] = useState(() => { const w = localStorage.getItem('bc2_ws'); return w ? new Date(w) : getMonday(new Date()); });
  const [activeDays, setActiveDays] = useState(() => loadJSON('bc2_days', DAY_NAMES.slice(0,6)));
  const [activeTab, setActiveTab] = useState(() => {
    const t = new Date().getDay(); const i = t === 0 ? 5 : t - 1;
    const days = loadJSON('bc2_days', DAY_NAMES.slice(0,6));
    const d = DAY_NAMES[i]; return days.includes(d) ? d : days[0] || 'lunes';
  });
  const [completed, setCompleted] = useState(() => loadJSON('bc2_done', {}));
  const [showSettings, setShowSettings] = useState(false);
  const [showAi, setShowAi] = useState(false);
  const [customSched, setCustomSched] = useState(() => loadJSON('bc2_custom', null));
  const [editMode, setEditMode] = useState(false);

  // Persist
  useEffect(() => { saveJSON('bc2_staff', staff); }, [staff]);
  useEffect(() => { localStorage.setItem('bc2_ws', weekStart.toISOString()); }, [weekStart]);
  useEffect(() => { saveJSON('bc2_days', activeDays); }, [activeDays]);
  useEffect(() => { saveJSON('bc2_done', completed); }, [completed]);
  useEffect(() => { if (customSched) saveJSON('bc2_custom', customSched); }, [customSched]);

  const autoSched = useMemo(() => generateSchedule(staff, tasks, activeDays), [staff, tasks, activeDays]);
  const schedule = customSched || autoSched;
  const weekDates = useMemo(() => getWeekDates(weekStart), [weekStart]);
  const dayIdx = activeDays.indexOf(activeTab);
  const dateLabel = weekDates[DAY_NAMES.indexOf(activeTab)] || '';
  const priorities = useMemo(() => getPriorities(activeTab, dayIdx, schedule, staff), [activeTab, dayIdx, schedule, staff]);

  const toggleDone = useCallback((day, bi, ti) => {
    const k = `${toISODate(weekStart)}_${day}_${bi}_${ti}`;
    setCompleted(p => ({...p, [k]: !p[k]}));
  }, [weekStart]);
  const isDone = useCallback((day, bi, ti) => {
    return !!completed[`${toISODate(weekStart)}_${day}_${bi}_${ti}`];
  }, [completed, weekStart]);

  const getDayProg = (day) => {
    const bl = schedule[day]; if (!bl) return 0;
    let tot=0, done=0;
    bl.forEach((b,bi) => b.tareas.forEach((t,ti) => { if (!t.isBreak) { tot++; if (isDone(day,bi,ti)) done++; } }));
    return tot === 0 ? 0 : Math.round(done/tot*100);
  };

  const swapTask = (day, fromB, fromT, toB) => {
    const ns = {...schedule}; const dd = [...ns[day]];
    const fb = {...dd[fromB], tareas:[...dd[fromB].tareas]};
    const tb = {...dd[toB], tareas:[...dd[toB].tareas]};
    const task = fb.tareas[fromT]; fb.tareas.splice(fromT,1);
    const ins = tb.tareas.findIndex(t => t.isBreak);
    ins >= 0 ? tb.tareas.splice(ins, 0, task) : tb.tareas.push(task);
    dd[fromB] = fb; dd[toB] = tb; ns[day] = dd;
    setCustomSched(ns);
  };

  // Staff mgmt
  const addStaff = () => {
    const ci = staff.length % COLORS.length;
    setStaff([...staff, { id: `s${Date.now()}`, name: 'Nuevo', schedule: '12:00 - 16:00', role: 'Part-time', color: COLORS[ci], isFullTime: false }]);
    setCustomSched(null);
  };
  const removeStaff = (id) => { setStaff(staff.filter(s => s.id !== id)); setCustomSched(null); };
  const updateStaff = (id, f, v) => { setStaff(staff.map(s => s.id === id ? {...s, [f]: v} : s)); if (f !== 'name') setCustomSched(null); };
  const regenerate = () => { setCustomSched(null); localStorage.removeItem('bc2_custom'); };

  return (
    <div className="min-h-screen bg-slate-100 font-sans text-slate-900 pb-8 text-left">
      {/* HEADER */}
      <header className="sticky top-0 z-50 bg-white border-b border-slate-200 px-4 py-3 shadow-sm">
        <div className="max-w-5xl mx-auto flex flex-col gap-2">
          <div className="flex justify-between items-center">
            <h1 className="text-xl font-black tracking-tighter uppercase">Black Chicken 2</h1>
            <button onClick={() => setShowSettings(!showSettings)} className="p-2 rounded-full hover:bg-slate-100">
              <Icon name="settings" size={18}/>
            </button>
          </div>

          {/* Week nav */}
          <div className="flex items-center justify-between">
            <button onClick={() => { const d = new Date(weekStart); d.setDate(d.getDate()-7); setWeekStart(d); setCustomSched(null); }}
              className="text-lg font-bold text-slate-300 hover:text-slate-700 px-2">&lsaquo;</button>
            <button onClick={() => { setWeekStart(getMonday(new Date())); setCustomSched(null); }}
              className="flex items-center gap-1.5 text-slate-500 hover:text-slate-700">
              <Icon name="calendar" size={13}/>
              <span className="text-[10px] font-bold uppercase tracking-wide">Semana del {fmtDate(weekStart)}</span>
            </button>
            <button onClick={() => { const d = new Date(weekStart); d.setDate(d.getDate()+7); setWeekStart(d); setCustomSched(null); }}
              className="text-lg font-bold text-slate-300 hover:text-slate-700 px-2">&rsaquo;</button>
          </div>

          {/* Day tabs */}
          <div className="flex gap-1 overflow-x-auto no-scrollbar">
            {activeDays.map(day => {
              const di = DAY_NAMES.indexOf(day);
              const prog = getDayProg(day);
              return (
                <button key={day} onClick={() => { setActiveTab(day); setShowAi(false); }}
                  className={`flex flex-col items-center px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all min-w-[52px] ${
                    activeTab === day ? 'bg-slate-900 text-white shadow-lg' : 'bg-slate-200 text-slate-500 hover:bg-slate-300'
                  }`}>
                  <span>{DAY_LABELS[di]}</span>
                  {prog > 0 && (
                    <div className={`w-full h-0.5 rounded-full mt-1 ${activeTab === day ? 'bg-white/30' : 'bg-slate-300'}`}>
                      <div className={`h-full rounded-full ${activeTab === day ? 'bg-white' : 'bg-emerald-500'}`} style={{width:`${prog}%`}}/>
                    </div>
                  )}
                </button>
              );
            })}
          </div>

          {/* Date + buttons */}
          <div className="flex justify-between items-center">
            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wide">{dateLabel}</span>
            <div className="flex gap-2">
              {editMode ? (
                <button onClick={() => setEditMode(false)}
                  className="flex items-center gap-1 bg-emerald-600 text-white px-3 py-1 rounded-full text-[10px] font-black uppercase">
                  <Icon name="save" size={12}/> Listo
                </button>
              ) : (
                <button onClick={() => setEditMode(true)}
                  className="flex items-center gap-1 bg-slate-200 text-slate-600 px-3 py-1 rounded-full text-[10px] font-black uppercase hover:bg-slate-300">
                  <Icon name="edit" size={12}/> Editar
                </button>
              )}
              <button onClick={() => setShowAi(!showAi)}
                className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-tighter transition-all">
                <Icon name="brain" size={14}/> Foco
              </button>
            </div>
          </div>
        </div>
      </header>

      {showSettings && <SettingsPanel staff={staff} activeDays={activeDays} weekStart={weekStart}
        setWeekStart={(d) => { setWeekStart(d); setCustomSched(null); }} setActiveDays={setActiveDays}
        addStaff={addStaff} removeStaff={removeStaff} updateStaff={updateStaff} regenerate={regenerate}
        onClose={() => setShowSettings(false)} />}

      <main className="max-w-5xl mx-auto p-3 flex flex-col gap-4">
        {/* AI Panel */}
        {showAi && (
          <div className="bg-slate-900 text-white rounded-2xl p-4 shadow-xl border-l-4 border-blue-500 fade-in">
            <div className="flex justify-between items-start mb-3">
              <h3 className="text-[10px] font-black uppercase tracking-widest text-blue-400 flex items-center gap-2">
                <Icon name="brain" size={14}/> Foco del Dia - {DAY_FULL[DAY_NAMES.indexOf(activeTab)]}
              </h3>
              <button onClick={() => setShowAi(false)} className="text-slate-500 hover:text-white"><Icon name="x" size={14}/></button>
            </div>
            <div className="space-y-2.5">
              {priorities.map((p,i) => (
                <div key={i} className="flex gap-2 items-start">
                  <span className="text-[9px] font-black text-blue-400 mt-0.5 min-w-[16px]">{i+1}.</span>
                  <p className="text-[11px] leading-relaxed text-slate-200 font-medium">{p}</p>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Schedule Cards */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {(schedule[activeTab] || []).map((bloque, bi) => {
            const person = staff.find(s => s.id === bloque.usuario);
            if (!person) return null;
            const c = CC[person.color] || CC.blue;
            return (
              <div key={bi} className={`rounded-2xl border-2 shadow-sm overflow-hidden ${c.card} ${bloque.isLeader ? 'ring-2 ring-blue-500/20' : ''} fade-in`}>
                <div className={`p-4 flex justify-between items-center border-b border-black/5 ${bloque.isLeader ? c.hdr : c.hdrAlt}`}>
                  <div>
                    <p className={`text-[9px] font-black uppercase ${bloque.isLeader ? 'opacity-70' : 'text-slate-500'} mb-0.5`}>{person.role}</p>
                    <h2 className={`text-lg font-black uppercase tracking-tight ${bloque.isLeader ? '' : 'text-slate-800'}`}>{person.name}</h2>
                  </div>
                  <p className={`text-[10px] font-bold flex items-center gap-1 ${bloque.isLeader ? '' : 'text-slate-500'}`}>
                    <Icon name="clock" size={12}/> {person.schedule}
                  </p>
                </div>
                <div className="p-2 space-y-1.5">
                  {bloque.tareas.map((t, ti) => {
                    const done = isDone(activeTab, bi, ti);
                    return (
                      <div key={ti} className={`flex gap-3 p-3 rounded-xl border transition-all ${
                        t.isBreak ? 'bg-orange-100 border-orange-200 text-orange-900'
                        : done ? 'bg-emerald-50 border-emerald-200 opacity-60'
                        : t.important ? 'bg-white border-slate-300 shadow-sm'
                        : 'bg-white/60 border-transparent'
                      }`}>
                        <div className="flex flex-col items-center min-w-[36px]">
                          <span className="text-[9px] font-black text-slate-500">{t.hora}</span>
                          <div className={`p-1.5 rounded-lg mt-1 ${t.isBreak ? 'bg-orange-200' : 'bg-slate-100'}`}>
                            <Icon name={t.icon} size={16}/>
                          </div>
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className={`text-sm font-bold leading-tight ${t.isBreak ? 'uppercase text-xs' : ''} ${done ? 'line-through' : ''}`}>{t.desc}</p>
                          {t.important && !done && (
                            <span className="text-[8px] font-black bg-slate-800 text-white px-1.5 py-0.5 rounded mt-1 inline-block uppercase tracking-tighter">Foco Prioritario</span>
                          )}
                          {editMode && !t.isBreak && (
                            <div className="flex gap-1 mt-1.5 flex-wrap">
                              {schedule[activeTab].map((ob, oi) => {
                                if (oi === bi) return null;
                                const op = staff.find(s => s.id === ob.usuario);
                                return op ? (
                                  <button key={oi} onClick={() => swapTask(activeTab, bi, ti, oi)}
                                    className="text-[8px] font-bold bg-slate-200 hover:bg-slate-300 text-slate-600 px-1.5 py-0.5 rounded transition-colors">
                                    â {op.name}
                                  </button>
                                ) : null;
                              })}
                            </div>
                          )}
                        </div>
                        {!t.isBreak && (
                          <button onClick={() => toggleDone(activeTab, bi, ti)} className="flex items-center shrink-0">
                            <div className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${
                              done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white hover:border-slate-400'
                            }`}>
                              {done && <Icon name="check" size={14}/>}
                            </div>
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>

        {/* Weekly summary */}
        <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
          <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3">Resumen Semanal</h3>
          <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
            {activeDays.map(day => {
              const di = DAY_NAMES.indexOf(day); const prog = getDayProg(day);
              return (
                <button key={day} onClick={() => setActiveTab(day)} className="text-center group">
                  <p className="text-[9px] font-black uppercase text-slate-400 group-hover:text-slate-600">{DAY_LABELS[di]}</p>
                  <div className="w-full h-2.5 bg-slate-100 rounded-full mt-1">
                    <div className={`h-full rounded-full transition-all ${prog === 100 ? 'bg-emerald-500' : prog > 0 ? 'bg-blue-500' : 'bg-slate-200'}`} style={{width:`${prog}%`}}/>
                  </div>
                  <p className="text-[10px] font-bold text-slate-500 mt-0.5">{prog}%</p>
                </button>
              );
            })}
          </div>
        </div>
      </main>

      <footer className="mt-4 text-center opacity-30">
        <p className="text-[8px] font-black uppercase tracking-[0.4em]">Black Chicken 2 - Operaciones 2026</p>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
