async function sbGet(p) { try { const r = await fetch(SUPA_URL + '/rest/v1/' + p, { headers: SB_H }); return r.ok ? await r.json() : []; } catch { return []; } }
async function sbRpc(fn, b) {
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:SB_H, body:JSON.stringify(b) });
    if (!r.ok) return { error: (await r.json().catch(()=>({}))).message || ('HTTP ' + r.status) };
    const t = await r.text();
    return { data: t ? JSON.parse(t) : null };
  } catch (e) { return { error: String(e) }; }
}

/* Quién puede asignar. Es solo para la interfaz — la regla de verdad
   vive en salon_can_assign() dentro de Supabase y no se puede saltar. */
const puedeAsignarRol = (role) => {
  const r = (role||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase();
  return (r.includes('jefe') || r.includes('jefa')) && r.includes('garzon') || r.startsWith('dueno');
};

/* ═══════════ FECHAS ═══════════ */
function getMonday(d){ const x=new Date(d); const w=x.getDay(); x.setDate(x.getDate()-w+(w===0?-6:1)); x.setHours(0,0,0,0); return x; }
function toISO(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().split('T')[0]; }
function fmtDate(d){ const m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; return `${d.getDate()} de ${m[d.getMonth()]}`; }
function dateOfDay(ws,day){ const d=new Date(ws); d.setDate(d.getDate()+ALL_DAYS.indexOf(day)); d.setHours(0,0,0,0); return d; }
function todayDayName(){ const t=new Date().getDay(); return ALL_DAYS[t===0?6:t-1]; }
function hhmm(ts){ const d=new Date(ts); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function toMin(h){ if(!h||!/^\d{1,2}:\d{2}$/.test(h)) return null; const [a,b]=h.split(':').map(Number); return a*60+b; }
const TOLERANCIA = 30;
function estado(due, ts){
  if(!ts) return 'pendiente';
  const a=toMin(due); if(a===null) return 'hecha';
  const r=toMin(hhmm(ts)); if(r===null) return 'hecha';
  return r<=a+TOLERANCIA ? 'a_tiempo' : 'atrasada';
}
const EST = {
  a_tiempo:{t:'A tiempo',c:'bg-emerald-500/15 text-emerald-500 border-emerald-500/30'},
  atrasada:{t:'Atrasada',c:'bg-amber-500/15 text-amber-600 border-amber-500/30'},

};

    back:<svg {...P}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
    home:<svg {...P}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
    logout:<svg {...P}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
    sun:<svg {...P}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>,

/* ═══════════ REPARTO ALEATORIO / EQUITATIVO ═══════════ */
function repartir(catalog, people, day, aleatorio, semilla) {
  const out = {};
  people.forEach(p => { out[p.id] = []; });
  if (!people.length) return out;
  const aplica = (t) => !t.days || t.days.includes(day);
  catalog.filter(t => t.is_break && aplica(t)).forEach(t => people.forEach(p => out[p.id].push(t.id)));

  let tareas = catalog.filter(t => !t.is_break && aplica(t));
  if (aleatorio) {
    /* barajado determinista por semilla — mismo click, mismo resultado visible */
    let s = semilla >>> 0;
    const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    tareas = [...tareas];
    for (let i = tareas.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [tareas[i], tareas[j]] = [tareas[j], tareas[i]]; }
  }
  /* reparto parejo: siempre la misma cantidad ±1 por persona */
  const desfase = aleatorio ? (semilla % people.length) : ALL_DAYS.indexOf(day) % people.length;
  tareas.forEach((t, i) => out[people[(i + desfase) % people.length].id].push(t.id));
  return out;
}
const ordenar = (catalog, ids) => {
  const by = Object.fromEntries(catalog.map(t => [t.id, t]));
  return [...(ids||[])].filter(i => by[i]).sort((a,b) => {
    const x = toMin(by[a].time), y = toMin(by[b].time);
    if (x===null && y===null) return 0; if (x===null) return 1; if (y===null) return -1;
    return x - y;
  });
};

/* ═══════════ LOGIN ═══════════ */
const Login = ({ loc, people, onLogin, onBack, theme, toggleTheme }) => {
  const [pin,setPin]=useState(''); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const L=LOCALES[loc];
  const intentar = async (p) => {
    setBusy(true);
    for (const per of people) {
      const r = await sbRpc('verify_pin', { p_person: per.id, p_pin: p });
      if (r.data === true) {
        setBusy(false);
        onLogin({ id:per.id, name:(per.name||'').split(' ')[0], role:per.role, pin:p, puedeAsignar:puedeAsignarRol(per.role) });
        return;
      }
    }
    setBusy(false); setErr('PIN incorrecto'); setPin('');
    if (navigator.vibrate) navigator.vibrate(180);
  };
  const press = (d) => { if(pin.length>=4||busy) return; const np=pin+d; setPin(np); setErr('');
    if (np.length===4) setTimeout(()=>intentar(np),120); };
  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 py-8">
      <button onClick={onBack} className="absolute top-5 left-5 flex items-center gap-1.5 dim text-[10px] font-black uppercase tracking-wider"><Icon name="back" size={14}/> Cambiar local</button>
      <button onClick={toggleTheme} className="absolute top-5 right-5 p-2 rounded-lg dim"><Icon name={theme==='dark'?'sun':'moon'} size={18}/></button>
      <img src="logo.png" alt="" className="w-20 h-20 object-contain mb-3"/>
      <h1 className="text-lg font-black uppercase tracking-tight">{L.name}</h1>
      <p className="text-[10px] dim mb-7">{L.dir}</p>
      <div className="flex gap-3 mb-2">
        {[0,1,2,3].map(i=><div key={i} className={`w-4 h-4 rounded-full border-2 ${pin.length>i?'bgold border-[color:var(--gold)]':'border-[color:var(--line)]'}`}/>)}
      </div>
      <p className={`text-[11px] font-bold h-5 mb-4 ${err?'text-rose-500':'dim'}`}>{busy?'Verificando…':(err||'Ingresa tu PIN')}</p>
      <div className="grid grid-cols-3 gap-3 w-full max-w-[250px]">
        {['1','2','3','4','5','6','7','8','9'].map(d=>(
          <button key={d} onClick={()=>press(d)} className="aspect-square rounded-2xl card2 border text-2xl font-bold active:bgold active:text-black">{d}</button>
        ))}
        <button onClick={()=>{setPin('');setErr('')}} className="aspect-square rounded-2xl border dim text-[10px] font-black uppercase">Borrar</button>
        <button onClick={()=>press('0')} className="aspect-square rounded-2xl card2 border text-2xl font-bold active:bgold active:text-black">0</button>
        <button onClick={()=>setPin(p=>p.slice(0,-1))} className="aspect-square rounded-2xl border dim flex items-center justify-center"><Icon name="back" size={18}/></button>
      </div>
      <p className="text-[9px] dim mt-7 uppercase tracking-widest text-center">Mismo PIN que usas en la app de checklists</p>
    </div>
  );
};

/* ═══════════ ASIGNACIÓN SEMANAL ═══════════ */
const SemanaView = ({ loc, catalog, people, days, weekStart, asign, guardar, puedeAsignar, toast }) => {

          <button onClick={()=>setCopiar(true)} className="flex items-center gap-1.5 card2 border px-3 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider"><Icon name="copy" size={12}/> Copiar día</button>
          <button onClick={limpiar} className="flex items-center gap-1.5 card2 border dim px-3 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider"><Icon name="trash" size={12}/> Limpiar</button>
        </div>
      )}

      {sinAsignar.length>0 && (
        <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3">
          <p className="text-[9px] font-black uppercase tracking-wider text-amber-600 mb-2 flex items-center gap-1.5"><Icon name="alert" size={12}/> Sin asignar este día · {sinAsignar.length}</p>
          <div className="flex flex-wrap gap-1.5">
            {sinAsignar.map(t=><span key={t.id} className="text-[10px] font-bold card2 border px-2 py-1 rounded-lg">{t.name}</span>)}
          </div>
        </div>
      )}

      {people.length===0 && (
        <div className="card border rounded-xl p-4 text-center">

        </div>

      {people.map((p,i)=>{
        const ids=ordenar(catalog,dia[p.id]);

        return (
          <div key={p.id} className="rounded-2xl card border overflow-hidden" style={{borderColor:col+'55'}}>
            <div className="px-4 py-2.5 border-b flex justify-between items-center" style={{background:col+'14',borderColor:'var(--line)'}}>

                <div className="w-2 h-2 rounded-full shrink-0" style={{background:col}}/>
                <span className="text-sm font-black uppercase tracking-tight truncate" style={{color:col}}>{p.name}</span>
                {p.puedeAsignar && <span className="text-[8px] font-black uppercase px-1.5 py-0.5 rounded bgold text-black shrink-0">Jefe</span>}
                {!p.pinOk && <span className="text-[8px] font-black uppercase px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-500 shrink-0">Sin PIN</span>}
              </div>
              <span className="text-[10px] font-black dim shrink-0">{ids.length}</span>
            </div>
            <div className="p-2.5 flex flex-wrap gap-1.5">
              {ids.map(id=>{
                const t=by[id];
                return (
                  <button key={id} disabled={!puedeAsignar} onClick={()=>quitar(p.id,id)}
                    className={`flex items-center gap-1.5 text-[10px] font-bold px-2 py-1.5 rounded-lg border ${t.is_break?'bg-orange-500/10 border-orange-500/30 text-orange-500':'card2'} ${puedeAsignar?'hover:border-rose-500/50':''}`}>
                    <span className="gold font-black">{t.time}</span>
                    <span className="truncate max-w-[150px]">{t.name}</span>
                    {puedeAsignar && <Icon name="x" size={10}/>}
                  </button>
                );
              })}
              {puedeAsignar && (
                <button onClick={()=>setPicker(p.id)} className="flex items-center gap-1 text-[10px] font-black uppercase px-2.5 py-1.5 rounded-lg border border-dashed dim">
                  <Icon name="plus" size={11}/> Agregar
                </button>
              )}
              {!ids.length && !puedeAsignar && <span className="text-[10px] dim px-1 py-1.5">Sin tareas</span>}
            </div>
          </div>
        );
      })}

      {picker && (
        <Sheet title={`Agregar · ${people.find(p=>p.id===picker)?.name||''}`} onClose={()=>setPicker(null)}>
          <p className="text-[10px] dim mb-3 font-medium">{DAY_FULL[ALL_DAYS.indexOf(day)]}</p>
          <div className="space-y-1.5">
            {disponibles.map(t=>{
              const suya=(dia[picker]||[]).includes(t.id);
              const otro=!suya&&Object.entries(dia).find(([sid,arr])=>sid!=String(picker)&&(arr||[]).includes(t.id));
              return (
                <button key={t.id} disabled={suya} onClick={()=>{poner(picker,t.id);setPicker(null);}}
                  className={`w-full flex items-center gap-3 p-3 rounded-xl border text-left ${suya?'bg-emerald-500/10 border-emerald-500/30 opacity-60':'card2 hover:border-[color:var(--gold)]'}`}>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-bold truncate">{t.name}</p>
                    <p className="text-[9px] font-bold dim">
                      {t.time}{t.photo_required?' · con foto':''}{otro?` · ya es de ${people.find(p=>String(p.id)===otro[0])?.name||'?'}`:''}
                    </p>
                  </div>
                  {suya&&<Icon name="check" size={16}/>}
                </button>
              );
            })}
          </div>
        </Sheet>
      )}

      {copiar && (
        <Sheet title={`Copiar ${DAY_FULL[ALL_DAYS.indexOf(day)]} a…`} onClose={()=>setCopiar(false)}>
          <div className="space-y-1.5">
            {days.filter(d=>d!==day).map(d=>(
              <button key={d} onClick={()=>copiarA([d])} className="w-full p-3 rounded-xl card2 border text-left text-sm font-bold">{DAY_FULL[ALL_DAYS.indexOf(d)]}</button>
            ))}
            <button onClick={()=>copiarA(days.filter(d=>d!==day))} className="w-full p-3 rounded-xl bgold text-black text-sm font-black uppercase tracking-wider">Todos los demás días</button>
          </div>
          <p className="text-[10px] text-amber-500 mt-3 font-medium">Las tareas de día fijo (viernes) se copian igual. Revísalo después.</p>
        </Sheet>
      )}
    </div>
  );
};

/* ═══════════ CONTROL ═══════════ */
const ControlView = ({ loc, weekStart, days, reporte, toast }) => {
  const [scope,setScope]=useState('dia');
  const [day,setDay]=useState(()=>days.includes(todayDayName())?todayDayName():days[0]);
  const [foto,setFoto]=useState(null);
  useEffect(()=>{ if(days.length&&!days.includes(day)) setDay(days[0]); },[days]);

  const filas = useMemo(()=>{
    const f = scope==='dia' ? reporte.filter(r=>r.day_name===day) : reporte.filter(r=>days.includes(r.day_name));
    return f.map(r=>({...r, est: estado(r.time_due, r.done_at)}));
  },[reporte,scope,day,days]);

  const st = {
    total: filas.length,
    ok: filas.filter(f=>f.est==='a_tiempo'||f.est==='hecha').length,
    tarde: filas.filter(f=>f.est==='atrasada').length,
    pend: filas.filter(f=>f.est==='pendiente').length,
    conFoto: filas.filter(f=>f.photo_url).length,
  };
  const pct = st.total ? Math.round((st.ok+st.tarde)/st.total*100) : 0;

  const csv = () => {
    const head='Local;Fecha;Dia;Persona;Tarea;Hora asignada;Hora real;Estado;Foto';
    const rows=filas.map(f=>[LOCALES[loc].name,f.work_date,DAY_FULL[ALL_DAYS.indexOf(f.day_name)],f.person_name,
      f.task_name,f.time_due||'',f.done_at?hhmm(f.done_at):'',EST[f.est].t,f.photo_url||''].join(';'));
    const blob=new Blob(['﻿'+[head,...rows].join('\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`Tareas_${loc}_${scope==='dia'?toISO(dateOfDay(weekStart,day)):'semana_'+toISO(weekStart)}.csv`; a.click();
  };
  const copiar = () => {
    const titulo = scope==='dia' ? `${DAY_FULL[ALL_DAYS.indexOf(day)]} ${fmtDate(dateOfDay(weekStart,day))}` : `Semana del ${fmtDate(weekStart)}`;
    let t=`*${LOCALES[loc].name} · Tareas de salón*\n${titulo}\nCumplimiento: ${pct}% (${st.ok+st.tarde}/${st.total})\n`;
    const porPersona={};
    filas.forEach(f=>{ (porPersona[f.person_name]=porPersona[f.person_name]||[]).push(f); });
    Object.entries(porPersona).forEach(([n,fs])=>{
      const hechas=fs.filter(f=>f.est!=='pendiente').length;
      t+=`\n*${n}* — ${hechas}/${fs.length}`;
      const tarde=fs.filter(f=>f.est==='atrasada'), pend=fs.filter(f=>f.est==='pendiente');
      if(tarde.length) t+=`\n  Atrasadas: ${tarde.map(f=>`${f.task_name} (${hhmm(f.done_at)} vs ${f.time_due})`).join(', ')}`;
      if(pend.length)  t+=`\n  Sin hacer: ${pend.map(f=>f.task_name).join(', ')}`;
    });
    try{navigator.clipboard?.writeText(t);}catch{}
    toast('Resumen copiado');
  };

  const personas = [...new Set(filas.map(f=>f.person_name))];

  return (
    <div className="space-y-3 fade-in">
      <div className="flex gap-2">
        {[['dia','Día'],['semana','Semana']].map(([k,l])=>(
          <button key={k} onClick={()=>setScope(k)} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider ${scope===k?'bgold text-black':'card2 border dim'}`}>{l}</button>
        ))}
      </div>
      {scope==='dia' && (
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
          {days.map(d=>(
            <button key={d} onClick={()=>setDay(d)} className={`px-3 py-1.5 rounded-xl text-[10px] font-black uppercase min-w-[48px] ${day===d?'bg-[color:var(--tx)] text-[color:var(--bg)]':'card2 border dim'}`}>{DAY_LABELS[ALL_DAYS.indexOf(d)]}</button>
          ))}
        </div>
      )}

      <div className="grid grid-cols-4 gap-2">
        {[['Asignadas',st.total,''],['A tiempo',st.ok,'text-emerald-500'],['Atrasadas',st.tarde,'text-amber-500'],['Sin hacer',st.pend,'text-rose-500']].map(([l,v,c])=>(
          <div key={l} className="card border rounded-xl p-2.5 text-center">
            <p className={`text-xl font-black ${c}`}>{v}</p>
            <p className="text-[8px] font-black uppercase tracking-wider dim mt-0.5">{l}</p>
          </div>
        ))}
      </div>

      <div className="card border rounded-xl p-3">
        <div className="flex justify-between items-center mb-2">
          <span className="text-[10px] font-black uppercase tracking-wider dim">Cumplimiento</span>
          <span className={`text-sm font-black ${pct>=90?'text-emerald-500':pct>=70?'text-amber-500':'text-rose-500'}`}>{pct}%</span>
        </div>
        <div className="w-full h-2 rounded-full" style={{background:'var(--line)'}}>
          <div className={`h-full rounded-full ${pct>=90?'bg-emerald-500':pct>=70?'bg-amber-500':'bg-rose-500'}`} style={{width:`${pct}%`}}/>
        </div>
        <p className="text-[9px] dim font-bold mt-2">{st.conFoto} de {st.total} con foto de respaldo</p>
      </div>

      <div className="flex gap-2">
        <button onClick={copiar} className="flex-1 flex items-center justify-center gap-1.5 card2 border px-3 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider"><Icon name="copy" size={12}/> Copiar resumen</button>
        <button onClick={csv} className="flex-1 flex items-center justify-center gap-1.5 card2 border px-3 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider"><Icon name="download" size={12}/> Exportar CSV</button>
      </div>

      {personas.map((n,i)=>{
        const suyas=filas.filter(f=>f.person_name===n);
        const ok=suyas.filter(f=>f.est!=='pendiente').length;
        const col=colorOf(i);
        return (
          <div key={n} className="rounded-2xl card border overflow-hidden" style={{borderColor:col+'55'}}>
            <div className="px-4 py-2.5 border-b flex justify-between items-center" style={{background:col+'14',borderColor:'var(--line)'}}>
              <div className="flex items-center gap-2 min-w-0">
                <div className="w-2 h-2 rounded-full" style={{background:col}}/>
                <span className="text-sm font-black uppercase tracking-tight truncate" style={{color:col}}>{n}</span>
              </div>
              <span className="text-[10px] font-black dim">{ok}/{suyas.length}</span>
            </div>
            <div className="divide-y" style={{borderColor:'var(--line)'}}>
              {suyas.map((f,j)=>(
                <div key={j} className="flex items-center gap-2 px-3 py-2">
                  {scope==='semana' && <span className="text-[8px] font-black dim w-7 shrink-0 uppercase">{DAY_LABELS[ALL_DAYS.indexOf(f.day_name)]}</span>}
                  <span className="text-[10px] font-black gold w-10 shrink-0">{f.time_due}</span>
                  <span className="text-[11px] font-bold flex-1 min-w-0 truncate">{f.task_name}</span>
                  {f.photo_url && <button onClick={()=>setFoto(f)} className="gold shrink-0"><Icon name="camera" size={13}/></button>}
                  <span className="text-[10px] font-black w-9 text-right shrink-0">{f.done_at?hhmm(f.done_at):'—'}</span>
                  <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border uppercase shrink-0 w-[62px] text-center ${EST[f.est].c}`}>{EST[f.est].t}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {!filas.length && <p className="text-center text-[11px] dim py-8 font-medium">No hay tareas asignadas en este período.</p>}

      {foto && (
        <Sheet title={`${foto.task_name} · ${foto.person_name}`} onClose={()=>setFoto(null)}>
          <img src={foto.photo_url} alt="" className="w-full rounded-xl border" style={{borderColor:'var(--line)'}}/>
          <p className="text-[10px] dim font-bold mt-2">Marcada a las {hhmm(foto.done_at)} · hora asignada {foto.time_due}</p>
        </Sheet>
      )}
    </div>
  );
};

/* ═══════════ CATÁLOGO (lectura) ═══════════ */
const TareasView = ({ catalog, days }) => (
  <div className="space-y-1.5 fade-in">
    <p className="text-[10px] font-black uppercase tracking-wider dim mb-2">{catalog.length} tareas · se editan en el SQL o desde el panel de Supabase</p>
    {[...catalog].sort((a,b)=>{const x=toMin(a.time),y=toMin(b.time);if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return -1;return x-y;}).map(t=>(
      <div key={t.id} className="flex items-center gap-3 p-3 rounded-xl card border">
        <div className="flex-1 min-w-0">
          <p className="text-sm font-bold truncate">{t.name}</p>
          <div className="flex gap-1.5 items-center flex-wrap mt-0.5">
            <span className="text-[9px] font-black gold">{t.time}</span>
            <span className={`text-[8px] font-black px-1.5 py-0.5 rounded uppercase ${t.priority==='alta'?'bgold text-black':'card2 border dim'}`}>{t.priority}</span>
            {t.days ? <span className="text-[8px] font-black bg-purple-500/20 text-purple-500 px-1.5 py-0.5 rounded uppercase">Solo {t.days.map(d=>DAY_LABELS[ALL_DAYS.indexOf(d)]).join('/')}</span>
                    : <span className="text-[8px] font-black bg-emerald-500/15 text-emerald-500 px-1.5 py-0.5 rounded uppercase">Todos los días</span>}
            {t.photo_required && <span className="text-[8px] font-black card2 border dim px-1.5 py-0.5 rounded uppercase flex items-center gap-1"><Icon name="camera" size={9}/> foto</span>}
            {t.is_break && <span className="text-[8px] font-black bg-orange-500/20 text-orange-500 px-1.5 py-0.5 rounded uppercase">Descanso</span>}
          </div>
        </div>
      </div>
    ))}
  </div>
);

/* ═══════════ APP ═══════════ */
const App = () => {
  const [theme,setTheme]=useState(()=>localStorage.getItem('bcops_theme')||'dark');
  const [loc,setLoc]=useState(()=>localStorage.getItem('bcops_loc')||null);
  const [user,setUser]=useState(null);
  const [people,setPeople]=useState([]);      /* salón asignable, espejo del organigrama */
  const [loginPool,setLoginPool]=useState([]); /* quién puede entrar: salón + jefaturas */
  const [catalog,setCatalog]=useState([]);
  const [days,setDays]=useState([]);
  const [asign,setAsign]=useState({});
  const [reporte,setReporte]=useState([]);
  const [weekStart,setWeekStart]=useState(()=>getMonday(new Date()));
  const [tab,setTab]=useState('semana');
  const [cargando,setCargando]=useState(true);
  const [aviso,setAviso]=useState(null);
  const [msg,setMsg]=useState(null);
  const toast=(m,t)=>{ setMsg({m,t}); setTimeout(()=>setMsg(null),2600); };

  useEffect(()=>{ document.documentElement.classList.toggle('light',theme==='light');
    document.querySelector('meta[name=theme-color]')?.setAttribute('content',theme==='light'?'#f4f4f5':'#0f0f0f');
    localStorage.setItem('bcops_theme',theme); },[theme]);
  const toggleTheme=()=>setTheme(t=>t==='dark'?'light':'dark');

  const weekISO=toISO(weekStart);

  /* Personal: organigrama (quién) × people de Supabase (id + PIN) */
  useEffect(()=>{
    if(!loc){ setCargando(false); return; }
    let vivo=true;
    (async()=>{
      setCargando(true);
      const [orgR, sup, cat] = await Promise.all([
        fetch('/api/personal').then(r=>r.json()).catch(()=>({ok:false,people:[]})),
        sbGet('people_public?select=id,name,role,local,station&station=in.(S,B)'),
        sbGet('salon_task_catalog?select=*&active=eq.true&order=sort_order'),
      ]);
      if(!vivo) return;

      const norm=s=>(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
      const supBy=Object.fromEntries((sup||[]).filter(p=>p.station==='S').map(p=>[norm(p.name),p]));
      setLoginPool((sup||[]).filter(p=>p.local===loc||p.local==='AMBOS'));
      const delLocal=(orgR.people||[]).filter(p=>p.local===loc);
      const faltantes=[];
      const lista=delLocal.map(p=>{
        const s=supBy[p.key];
        if(!s) faltantes.push(p.name);
        return s ? { id:s.id, name:p.name.split(' ')[0], fullName:p.name, role:p.role, puedeAsignar:p.isJefe, pinOk:true }
                 : { id:'x_'+p.key, name:p.name.split(' ')[0], fullName:p.name, role:p.role, puedeAsignar:p.isJefe, pinOk:false };
      }).filter(p=>p.pinOk);

      setPeople(lista);
      setCatalog((cat||[]).map(t=>({...t, time:t.time_due||''})));
      setDays(ALL_DAYS.slice(0,LOCALES[loc].openDays));

      const problemas=[];
      if(!orgR.ok) problemas.push('No pude leer el organigrama; el personal puede estar incompleto.');
      if(faltantes.length) problemas.push('Sin PIN en la base (no pueden entrar): '+faltantes.join(', ')+'.');
      if(!cat||!cat.length) problemas.push('El catálogo de tareas está vacío: falta correr schema_tareas_salon.sql en Supabase.');
      setAviso(problemas.length?problemas:null);
      setCargando(false);
    })();
    return ()=>{vivo=false};
  },[loc]);

  /* Asignación + reporte de la semana */
  const cargarSemana = useCallback(async()=>{
    if(!loc) return;
    const rows = await sbGet(`salon_assignments?select=day_name,person_id,task_id&local=eq.${loc}&week_start=eq.${weekISO}`);
    const a={};
    (rows||[]).forEach(r=>{ (a[r.day_name]=a[r.day_name]||{}); (a[r.day_name][r.person_id]=a[r.day_name][r.person_id]||[]).push(r.task_id); });
    setAsign(a);
    const rep = await sbRpc('salon_week_report',{p_local:loc,p_week:weekISO});
    setReporte(Array.isArray(rep.data)?rep.data:[]);
  },[loc,weekISO]);
  useEffect(()=>{ cargarSemana(); },[cargarSemana]);

  /* Guardar un día (o varios, al copiar) */
  const guardar = async (day, payload) => {
    if(!user?.puedeAsignar){ toast('Solo los jefes de garzones pueden asignar','error'); return; }
    const lotes = day ? [[day,payload]] : Object.entries(payload);
    const prev = asign;
    const nuevo = {...asign};
    lotes.forEach(([d,v])=>{ nuevo[d]=v; });
    setAsign(nuevo);                       /* optimista */
    for (const [d,v] of lotes) {
      const limpio={}; Object.entries(v).forEach(([pid,ids])=>{ if(ids&&ids.length) limpio[pid]=ids; });
      const r = await sbRpc('salon_set_day',{ p_actor:user.id, p_pin:user.pin, p_local:loc, p_week:weekISO, p_day:d, p_assign:limpio });
      if (r.error) { setAsign(prev); toast(r.error.includes('jefes')?'Solo los jefes de garzones pueden asignar':'No se pudo guardar','error'); return; }
    }
    toast('Guardado');
    cargarSemana();
  };

  const pickLocal=(id)=>{ setLoc(id); localStorage.setItem('bcops_loc',id); setUser(null); };
  const cambiarLocal=()=>{ setUser(null); setLoc(null); localStorage.removeItem('bcops_loc'); };

  if(!loc) return <LocalPicker onPick={pickLocal} theme={theme} toggleTheme={toggleTheme}/>;
  if(cargando) return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-4">
      <img src="logo.png" className="w-20 h-20 object-contain opacity-40 animate-pulse" alt=""/>
      <p className="text-[10px] font-black uppercase tracking-[0.3em] dim">Cargando</p>
    </div>
  );
  if(!user) return <Login loc={loc} people={loginPool} onLogin={setUser} onBack={cambiarLocal} theme={theme} toggleTheme={toggleTheme}/>;

  const L=LOCALES[loc];
  const esHoySemana = weekISO===toISO(getMonday(new Date()));

  return (
    <div className="min-h-screen pb-28">
      <header className="sticky top-0 z-40 border-b px-4 py-3" style={{background:'var(--bg)',borderColor:'var(--line)'}}>
        <div className="max-w-3xl mx-auto">
          <div className="flex justify-between items-center gap-2">
            <div className="flex items-center gap-2.5 min-w-0">
              <img src="logo.png" className="w-8 h-8 object-contain shrink-0" alt=""/>
              <div className="min-w-0">
                <h1 className="text-sm font-black uppercase tracking-tight leading-none truncate">{L.name}</h1>
                <p className="text-[9px] font-bold gold uppercase tracking-wider mt-0.5">
                  {user.name}{user.puedeAsignar?' · puede asignar':' · solo lectura'}
                </p>
              </div>
            </div>
            <div className="flex gap-1 shrink-0">
              <button onClick={toggleTheme} className="p-2 rounded-lg dim"><Icon name={theme==='dark'?'sun':'moon'} size={17}/></button>
              <button onClick={cambiarLocal} className="p-2 rounded-lg dim"><Icon name="home" size={17}/></button>
              <button onClick={()=>setUser(null)} className="p-2 rounded-lg dim"><Icon name="logout" size={17}/></button>
            </div>
          </div>
          <div className="flex items-center justify-between mt-2.5">
            <button onClick={()=>{const d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d);}} className="px-2 dim text-lg font-bold">‹</button>
            <button onClick={()=>setWeekStart(getMonday(new Date()))} className="flex items-center gap-1.5 dim">
              <Icon name="calendar" size={12}/>
              <span className="text-[10px] font-black uppercase tracking-wider">Semana del {fmtDate(weekStart)}</span>
              {!esHoySemana && <span className="text-[8px] font-black bg-amber-500/20 text-amber-600 px-1.5 py-0.5 rounded uppercase">Otra semana</span>}
            </button>
            <button onClick={()=>{const d=new Date(weekStart);d.setDate(d.getDate()+7);setWeekStart(d);}} className="px-2 dim text-lg font-bold">›</button>
          </div>
        </div>
      </header>

      <main className="max-w-3xl mx-auto p-3 space-y-3">
        {aviso && (
          <div className="bg-rose-500/10 border border-rose-500/30 rounded-xl p-3 space-y-1">
            {aviso.map((a,i)=><p key={i} className="text-[10px] font-bold text-rose-500 flex gap-1.5"><Icon name="alert" size={12}/> {a}</p>)}
          </div>
        )}
        {tab==='semana'  && <SemanaView loc={loc} catalog={catalog} people={people} days={days} weekStart={weekStart}
                              asign={asign} guardar={guardar} puedeAsignar={!!user.puedeAsignar} toast={toast}/>}
        {tab==='control' && <ControlView loc={loc} weekStart={weekStart} days={days} reporte={reporte} toast={toast}/>}
        {tab==='tareas'  && <TareasView catalog={catalog} days={days}/>}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-40 border-t px-2 py-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]" style={{background:'var(--card)',borderColor:'var(--line)'}}>
        <div className="max-w-3xl mx-auto grid grid-cols-3 gap-1">
          {[['semana','Asignar','grid'],['control','Control','chart'],['tareas','Tareas','list']].map(([k,l,ic])=>(
            <button key={k} onClick={()=>setTab(k)} className={`flex flex-col items-center gap-1 py-2 rounded-xl ${tab===k?'bgold text-black':'dim'}`}>
              <Icon name={ic} size={17}/>
              <span className="text-[8px] font-black uppercase tracking-wider">{l}</span>
            </button>
          ))}
        </div>
      </nav>

      <Toast msg={msg?.m} tipo={msg?.t}/>

      <footer className="mt-6 text-center opacity-30 pb-2">
        <p className="text-[8px] font-black uppercase tracking-[0.4em]">Black Chicken · Planificación de Salón 2026</p>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
