async function sbRpc(fn, b) {
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:SB_H, body:JSON.stringify(b) });

function getMonday(d){ const x=new Date(d); const w=x.getDay(); x.setDate(x.getDate()-w+(w===0?-6:1)); x.setHours(0,0,0,0); return x; }
function toISO(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().split('T')[0]; }
function fmtDate(d){ const m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; return `${d.getDate()} de ${m[d.getMonth()]}`; }
function dateOfDay(ws,day){ const d=new Date(ws); d.setDate(d.getDate()+ALL_DAYS.indexOf(day)); d.setHours(0,0,0,0); return d; }
function todayDayName(){ const t=new Date().getDay(); return ALL_DAYS[t===0?6:t-1]; }
function hhmm(ts){ const d=new Date(ts); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function toMin(h){ if(!h||!/^\d{1,2}:\d{2}$/.test(h)) return null; const [a,b]=h.split(':').map(Number); return a*60+b; }
const TOLERANCIA = 30;
function estado(due, ts){
  if(!ts) return 'pendiente';
  const a=toMin(due); if(a===null) return 'hecha';
  const r=toMin(hhmm(ts)); if(r===null) return 'hecha';
  return r<=a+TOLERANCIA ? 'a_tiempo' : 'atrasada';

/* ═══════════ REPARTO ALEATORIO / EQUITATIVO ═══════════ */
function repartir(catalog, people, day, aleatorio, semilla) {
  const out = {};
  people.forEach(p => { out[p.id] = []; });
  if (!people.length) return out;
  const aplica = (t) => !t.days || t.days.includes(day);
  catalog.filter(t => t.is_break && aplica(t)).forEach(t => people.forEach(p => out[p.id].push(t.id)));

  let tareas = catalog.filter(t => !t.is_break && aplica(t));
  if (aleatorio) {
    /* barajado determinista por semilla — mismo click, mismo resultado visible */
    let s = semilla >>> 0;
    const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    tareas = [...tareas];
    for (let i = tareas.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [tareas[i], tareas[j]] = [tareas[j], tareas[i]]; }
  }
  /* reparto parejo: siempre la misma cantidad ±1 por persona */
  const desfase = aleatorio ? (semilla % people.length) : ALL_DAYS.indexOf(day) % people.length;
  tareas.forEach((t, i) => out[people[(i + desfase) % people.length].id].push(t.id));
  return out;
}
/* Reparto de la SEMANA completa.
   Un solo barajado para toda la semana y un desfase que avanza un puesto por día:
   así cada día queda parejo y, además, la misma tarea le toca a una persona
   distinta cada día (nadie barre toda la semana). */
function repartirSemana(catalog, people, days, semilla) {
  const out = {};
  if (!people.length) { days.forEach(d => { out[d] = {}; }); return out; }

  let s = semilla >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const orden = catalog.filter(t => !t.is_break);
  for (let i = orden.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [orden[i], orden[j]] = [orden[j], orden[i]]; }

  days.forEach((day, di) => {
    const dia = {};
    people.forEach(p => { dia[p.id] = []; });
    const aplica = (t) => !t.days || t.days.includes(day);
    catalog.filter(t => t.is_break && aplica(t)).forEach(t => people.forEach(p => dia[p.id].push(t.id)));
    orden.filter(aplica).forEach((t, i) => { dia[people[(i + di) % people.length].id].push(t.id); });
    out[day] = dia;
  });
  return out;
}

const ordenar = (catalog, ids) => {
  const by = Object.fromEntries(catalog.map(t => [t.id, t]));
  return [...(ids||[])].filter(i => by[i]).sort((a,b) => {
    const x = toMin(by[a].time), y = toMin(by[b].time);
    if (x===null && y===null) return 0; if (x===null) return 1; if (y===null) return -1;
    return x - y;
  });
};

const Login = ({ loc, people, onLogin, onBack, theme, toggleTheme }) => {
  const [pin,setPin]=useState(''); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const L=LOCALES[loc];
  const intentar = async (p) => {
    setBusy(true);
    /* Dueño y administración no están en el roster visible: se validan aparte.
       La propia función dice si esa persona puede asignar o entra en solo lectura. */
    const own = await sbRpc('salon_owner_login', { p_pin: p });
    if (Array.isArray(own.data) && own.data.length) {
      const o = own.data[0];
      setBusy(false);
      onLogin({ id:o.id, name:o.name, role:o.role, pin:p, puedeAsignar: o.puede_asignar === true });
      return;
    }
    for (const per of people) {
      const r = await sbRpc('verify_pin', { p_person: per.id, p_pin: p });
      if (r.data === true) {
        setBusy(false);
        onLogin({ id:per.id, name:(per.name||'').split(' ')[0], role:per.role, pin:p, puedeAsignar:puedeAsignarRol(per.role) });
        return;
      }
    }
    setBusy(false); setErr('PIN incorrecto'); setPin('');
    if (navigator.vibrate) navigator.vibrate(180);
  };
  const press = (d) => { if(pin.length>=4||busy) return; const np=pin+d; setPin(np); setErr('');
    if (np.length===4) setTimeout(()=>intentar(np),120); };
  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 py-8">
      <button onClick={onBack} className="absolute top-5 left-5 flex items-center gap-1.5 dim text-[10px] font-black uppercase tracking-wider"><Icon name="back" size={14}/> Cambiar local</button>
      <button onClick={toggleTheme} className="absolute top-5 right-5 p-2 rounded-lg dim"><Icon name={theme==='dark'?'sun':'moon'} size={18}/></button>
      <img src="logo.png" alt="" className="w-20 h-20 object-contain mb-3"/>
      <h1 className="text-lg font-black uppercase tracking-tight">{L.name}</h1>
      <p className="text-[10px] dim mb-7">{L.dir}</p>
      <div className="flex gap-3 mb-2">
        {[0,1,2,3].map(i=><div key={i} className={`w-4 h-4 rounded-full border-2 ${pin.length>i?'bgold border-[color:var(--gold)]':'border-[color:var(--line)]'}`}/>)}
      </div>
      <p className={`text-[11px] font-bold h-5 mb-4 ${err?'text-rose-500':'dim'}`}>{busy?'Verificando…':(err||'Ingresa tu PIN')}</p>
      <div className="grid grid-cols-3 gap-3 w-full max-w-[250px]">
        {['1','2','3','4','5','6','7','8','9'].map(d=>(
          <button key={d} onClick={()=>press(d)} className="aspect-square rounded-2xl card2 border text-2xl font-bold active:bgold active:text-black">{d}</button>
        ))}
        <button onClick={()=>{setPin('');setErr('')}} className="aspect-square rounded-2xl border dim text-[10px] font-black uppercase">Borrar</button>
        <button onClick={()=>press('0')} className="aspect-square rounded-2xl card2 border text-2xl font-bold active:bgold active:text-black">0</button>
        <button onClick={()=>setPin(p=>p.slice(0,-1))} className="aspect-square rounded-2xl border dim flex items-center justify-center"><Icon name="back" size={18}/></button>
      </div>
      <p className="text-[9px] dim mt-7 uppercase tracking-widest text-center">Mismo PIN que usas en la app de checklists</p>
    </div>
  );
};

/* ═══════════ EQUIPO DE LA SEMANA (rotación entre locales) ═══════════ */
/* Regla: los dos jefes de garzones nunca están en el mismo local.
   Si quien define el equipo es un jefe, él queda fijo aquí y el otro
   jefe queda fijo en el otro local. Si lo define el dueño, puede elegir
   cuál de los dos va aquí, pero solo uno. */
const RosterSheet = ({ loc, salonPool, rosterWeek, onSave, onClose, weekStart, userId }) => {
  const jefes = salonPool.filter(p=>p.puedeAsignar);
  const soyJefe = jefes.some(j=>j.id===userId);
  const otro = loc==='BC1' ? 'BC2' : 'BC1';

  const inicial = rosterWeek.length
    ? rosterWeek.filter(r=>r.en_este_local).map(r=>r.person_id)
    : (soyJefe ? [userId] : []);          /* parte vacío: se marca a quien SÍ está */
  const [sel,setSel]=useState(inicial);

  const fijo = (p) => soyJefe && p.puedeAsignar;   /* los jefes no se tocan si soy jefe */
  const toggle=(p)=>{
    if (fijo(p)) return;
    setSel(s=>{
      if (s.includes(p.id)) return s.filter(x=>x!==p.id);
      /* solo puede haber un jefe de garzones por local */
      const limpio = p.puedeAsignar ? s.filter(x=>!jefes.some(j=>j.id===x)) : s;
      return [...limpio, p.id];
    });
  };
  const soloGarzones = () => setSel(s=>{
    const jefeActual = s.filter(x=>jefes.some(j=>j.id===x));
    const base = soyJefe ? [userId] : jefeActual;
    return [...new Set([...base, ...salonPool.filter(p=>!p.puedeAsignar).map(p=>p.id)])];
  });

  return (
    <Sheet title={`Equipo de la semana · ${LOCALES[loc].name}`} onClose={onClose}>
      <p className="text-[11px] dim font-medium mb-1">Semana del {fmtDate(weekStart)}</p>
      <p className="text-[11px] dim font-medium mb-2">
        Marca quiénes trabajan contigo en <b className="gold">{LOCALES[loc].name}</b>.
        Los que no marques quedan automáticamente en <b>{LOCALES[otro].name}</b>.
      </p>
      <p className="text-[10px] dim font-medium mb-4">
        {soyJefe
          ? `Tú quedas fijo aquí y el otro jefe de garzones en ${LOCALES[otro].name}: nunca están los dos en el mismo local.`
          : 'Solo puede haber un jefe de garzones por local — al marcar uno se desmarca el otro.'}
      </p>

      <div className="space-y-1.5">
        {salonPool.map(p=>{
          const on=sel.includes(p.id);
          const bloq=fijo(p);
          return (
            <button key={p.id} onClick={()=>toggle(p)} disabled={bloq}
              className={`w-full flex items-center gap-3 p-3 rounded-xl border text-left transition-all ${
                on ? 'bg-[#D4A843]/10 border-[color:var(--gold)]' : 'card2'
              } ${bloq ? 'opacity-70' : ''}`}>
              <div className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 ${
                on ? 'bgold border-[color:var(--gold)] text-black' : 'border-[color:var(--line)]'
              }`}>{on && <Icon name="check" size={14}/>}</div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-bold truncate">{p.fullName||p.name}</p>
                <p className="text-[9px] font-bold dim truncate">
                  {p.role}{bloq ? (on ? ' · fijo aquí' : ` · fijo en ${LOCALES[otro].name}`) : ''}
                </p>
              </div>
              <span className={`text-[9px] font-black uppercase px-2 py-1 rounded shrink-0 ${
                on ? 'bgold text-black' : 'card2 border dim'
              }`}>{on ? LOCALES[loc].num : LOCALES[otro].num}</span>
            </button>
          );
        })}
      </div>

      <div className="flex items-center justify-between mt-4 mb-3 px-1 gap-2">
        <span className="text-[10px] font-black uppercase tracking-wider dim">
          {sel.length} en {LOCALES[loc].name} · {salonPool.length - sel.length} en {LOCALES[otro].name}
        </span>
        <button onClick={soloGarzones} className="text-[10px] font-black uppercase gold shrink-0">Todos los garzones</button>
      </div>

      {sel.length === 0 && (
        <p className="text-[10px] text-rose-500 font-bold mb-3 text-center">Marca al menos una persona.</p>
      )}
      <button disabled={!sel.length} onClick={()=>onSave(sel)}
        className={`w-full py-3 rounded-xl text-xs font-black uppercase tracking-wider ${
          sel.length ? 'bgold text-black' : 'card2 border dim'
        }`}>Guardar equipo de la semana</button>
      <p className="text-[10px] dim font-medium mt-3">
        Si alguien cambia de local, las tareas que tenía asignadas esa semana en el local anterior se borran solas.
      </p>
    </Sheet>
  );
};

const ControlView = ({ loc, weekStart, days, reporte, toast }) => {
  const [scope,setScope]=useState('dia');
  const [day,setDay]=useState(()=>days.includes(todayDayName())?todayDayName():days[0]);
  const [foto,setFoto]=useState(null);
  useEffect(()=>{ if(days.length&&!days.includes(day)) setDay(days[0]); },[days]);

  const filas = useMemo(()=>{
    const f = scope==='dia' ? reporte.filter(r=>r.day_name===day) : reporte.filter(r=>days.includes(r.day_name));
    return f.map(r=>({...r, est: estado(r.time_due, r.done_at)}));
  },[reporte,scope,day,days]);

  const st = {
    total: filas.length,
    ok: filas.filter(f=>f.est==='a_tiempo'||f.est==='hecha').length,
    tarde: filas.filter(f=>f.est==='atrasada').length,
    pend: filas.filter(f=>f.est==='pendiente').length,
    conFoto: filas.filter(f=>f.photo_url).length,
  };
  const pct = st.total ? Math.round((st.ok+st.tarde)/st.total*100) : 0;

  const csv = () => {
    const head='Local;Fecha;Dia;Persona;Tarea;Hora asignada;Hora real;Estado;Foto';
    const rows=filas.map(f=>[LOCALES[loc].name,f.work_date,DAY_FULL[ALL_DAYS.indexOf(f.day_name)],f.person_name,
      f.task_name,f.time_due||'',f.done_at?hhmm(f.done_at):'',EST[f.est].t,f.photo_url||''].join(';'));
    const blob=new Blob(['﻿'+[head,...rows].join('\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`Tareas_${loc}_${scope==='dia'?toISO(dateOfDay(weekStart,day)):'semana_'+toISO(weekStart)}.csv`; a.click();
  };
  const copiar = () => {
    const titulo = scope==='dia' ? `${DAY_FULL[ALL_DAYS.indexOf(day)]} ${fmtDate(dateOfDay(weekStart,day))}` : `Semana del ${fmtDate(weekStart)}`;
    let t=`*${LOCALES[loc].name} · Tareas de salón*\n${titulo}\nCumplimiento: ${pct}% (${st.ok+st.tarde}/${st.total})\n`;
    const porPersona={};
    filas.forEach(f=>{ (porPersona[f.person_name]=porPersona[f.person_name]||[]).push(f); });
    Object.entries(porPersona).forEach(([n,fs])=>{
      const hechas=fs.filter(f=>f.est!=='pendiente').length;
      t+=`\n*${n}* — ${hechas}/${fs.length}`;
      const tarde=fs.filter(f=>f.est==='atrasada'), pend=fs.filter(f=>f.est==='pendiente');
      if(tarde.length) t+=`\n  Atrasadas: ${tarde.map(f=>`${f.task_name} (${hhmm(f.done_at)} vs ${f.time_due})`).join(', ')}`;
      if(pend.length)  t+=`\n  Sin hacer: ${pend.map(f=>f.task_name).join(', ')}`;
    });
    try{navigator.clipboard?.writeText(t);}catch{}
    toast('Resumen copiado');
  };

  const personas = [...new Set(filas.map(f=>f.person_name))];

  return (
    <div className="space-y-3 fade-in">
      <div className="flex gap-2">
        {[['dia','Día'],['semana','Semana']].map(([k,l])=>(
          <button key={k} onClick={()=>setScope(k)} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider ${scope===k?'bgold text-black':'card2 border dim'}`}>{l}</button>
        ))}
      </div>
      {scope==='dia' && (
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
          {days.map(d=>(
            <button key={d} onClick={()=>setDay(d)} className={`px-3 py-1.5 rounded-xl text-[10px] font-black uppercase min-w-[48px] ${day===d?'bg-[color:var(--tx)] text-[color:var(--bg)]':'card2 border dim'}`}>{DAY_LABELS[ALL_DAYS.indexOf(d)]}</button>
          ))}
        </div>
      )}

      <div className="grid grid-cols-4 gap-2">

};

/* ═══════════ CATÁLOGO DE TAREAS (editable) ═══════════ */
const TareaEditor = ({ t, days, loc, onSave, onClose, onToggleActive, guardando }) => {
  const [f,setF]=useState(t);
  const [err,setErr]=useState('');
  const up=(k,v)=>setF(p=>({...p,[k]:v}));
  const esNueva=!f.id;
  const toggleDia=(d)=>{
    const cur=f.days||[];
    const nd=cur.includes(d)?cur.filter(x=>x!==d):[...cur,d].sort((a,b)=>ALL_DAYS.indexOf(a)-ALL_DAYS.indexOf(b));
    up('days',nd.length?nd:null);
  };
  const toggleLocal=(L)=>{
    const cur=f.locals||['BC1','BC2'];
    const nl=cur.includes(L)?cur.filter(x=>x!==L):[...cur,L];
    up('locals',nl);
  };
  const guardar=()=>{
    if(!String(f.name||'').trim()){ setErr('Ponle un nombre a la tarea.'); return; }
    if(!(f.locals||['BC1','BC2']).length){ setErr('Elige al menos un local.'); return; }
    const hora=String(f.time_due||'').trim();
    if(hora && hora!=='cierre' && !/^\d{1,2}:\d{2}$/.test(hora)){ setErr('La hora va como 15:00, o escribe "cierre".'); return; }
    setErr(''); onSave(f);
  };

  return (
    <Sheet title={esNueva?'Nueva tarea':'Editar tarea'} onClose={onClose}>
      <Fld label="¿Qué hay que hacer?">
        <input className={inputCls} value={f.name||''} onChange={e=>up('name',e.target.value)}
          placeholder="Ej: Limpiar la lámpara de la entrada" autoFocus/>
      </Fld>

      <div className="grid grid-cols-2 gap-3">
        <Fld label="¿A qué hora?">
          <input className={inputCls} value={f.time_due||''} onChange={e=>up('time_due',e.target.value)} placeholder="15:00 o cierre"/>
        </Fld>
        <Fld label="Prioridad">
          <select className={inputCls} value={f.priority||'media'} onChange={e=>up('priority',e.target.value)}>
            <option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option>
          </select>
        </Fld>
      </div>

      <Fld label="¿Cada cuánto?">
        <div className="flex gap-1.5 flex-wrap">
          <button onClick={()=>up('days',null)}
            className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase ${!f.days?'bgold text-black':'card2 border dim'}`}>
            Todos los días
          </button>
          {ALL_DAYS.map((d,i)=>(
            <button key={d} onClick={()=>toggleDia(d)}
              className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase ${
                f.days&&f.days.includes(d)?'bg-purple-500 text-white':'card2 border dim'}`}>{DAY_LABELS[i]}</button>
          ))}
        </div>
        <p className="text-[10px] dim font-medium mt-1.5">
          {f.days ? `Solo ${f.days.map(d=>DAY_FULL[ALL_DAYS.indexOf(d)].toLowerCase()).join(', ')}.`
                  : 'Aparece todos los días que el local opera.'}
        </p>
      </Fld>

      <Fld label="¿Necesita foto de respaldo?">
        <div className="grid grid-cols-2 gap-2">
          <button onClick={()=>up('photo_required',true)}
            className={`p-3 rounded-xl border text-left ${f.photo_required!==false?'bg-[#D4A843]/10 border-[color:var(--gold)]':'card2'}`}>
            <p className="text-[12px] font-black flex items-center gap-1.5"><Icon name="camera" size={13}/> Sí, obligatoria</p>
            <p className="text-[9px] dim font-medium mt-0.5">No se puede marcar sin foto</p>
          </button>
          <button onClick={()=>up('photo_required',false)}
            className={`p-3 rounded-xl border text-left ${f.photo_required===false?'bg-[#D4A843]/10 border-[color:var(--gold)]':'card2'}`}>
            <p className="text-[12px] font-black">No hace falta</p>
            <p className="text-[9px] dim font-medium mt-0.5">Puede adjuntarla igual</p>
          </button>
        </div>
      </Fld>

      <Fld label="¿En qué locales?">
        <div className="flex gap-1.5">
          {['BC1','BC2'].map(L=>{
            const on=(f.locals||['BC1','BC2']).includes(L);
            return (
              <button key={L} onClick={()=>toggleLocal(L)}
                className={`flex-1 px-3 py-2.5 rounded-xl text-[11px] font-black uppercase border ${
                  on?'bgold text-black border-[color:var(--gold)]':'card2 dim'}`}>{LOCALES[L].name}</button>
            );
          })}
        </div>
      </Fld>

      <Fld label="Ícono">
        <div className="flex gap-1.5 flex-wrap">
          {ICON_NAMES.map(n=>(
            <button key={n} onClick={()=>up('icon',n)}
              className={`p-2 rounded-lg border ${f.icon===n?'bgold text-black border-[color:var(--gold)]':'card2 dim'}`}>
              <Icon name={n} size={16}/>
            </button>
          ))}
        </div>
      </Fld>

      <Fld label="Tipo">
        <button onClick={()=>up('is_break',!f.is_break)}
          className={`w-full p-3 rounded-xl border text-left text-sm font-bold ${
            f.is_break?'bg-orange-500/10 border-orange-500/40 text-orange-500':'card2 dim'}`}>
          {f.is_break?'Es un descanso — se le asigna a todos automáticamente':'Tarea normal'}
        </button>
      </Fld>

      {err && <p className="text-[11px] font-bold text-rose-500 mb-3">{err}</p>}

      <div className="flex gap-2 mt-4">
        {!esNueva && (
          <button onClick={()=>onToggleActive(f)}
            className={`px-4 py-3 rounded-xl border text-[10px] font-black uppercase tracking-wider ${
              f.active===false?'border-emerald-500/50 text-emerald-500':'border-rose-500/40 text-rose-500'}`}>
            {f.active===false?'Reactivar':'Desactivar'}
          </button>
        )}
        <button disabled={guardando} onClick={guardar}
          className={`flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-wider ${
            guardando?'card2 border dim':'bgold text-black'}`}>
          {guardando?'Guardando…':'Guardar tarea'}
        </button>
      </div>
      {!esNueva && (
        <p className="text-[10px] dim font-medium mt-3">
          Las tareas no se borran: al desactivarlas dejan de aparecer y se quitan de las semanas
          que vienen, pero el historial de lo ya hecho queda intacto.
        </p>
      )}
    </Sheet>
  );
};

/* ═══════════ APP ═══════════ */
const App = () => {
  const [theme,setTheme]=useState(()=>localStorage.getItem('bcops_theme')||'dark');
  const [loc,setLoc]=useState(()=>localStorage.getItem('bcops_loc')||null);
  const [user,setUser]=useState(null);
  const [people,setPeople]=useState([]);       /* salón según el organigrama (respaldo) */
  const [loginPool,setLoginPool]=useState([]); /* quién puede entrar: salón + jefaturas */
  const [salonPool,setSalonPool]=useState([]); /* TODOS los garzones, rotan entre locales */
  const [catalogAll,setCatalogAll]=useState([]); /* catálogo del local, incluye desactivadas */
  const [rosterWeek,setRosterWeek]=useState([]); /* equipo definido para esta semana */
  const [catalog,setCatalog]=useState([]);
  const [days,setDays]=useState([]);
  const [asign,setAsign]=useState({});
  const [reporte,setReporte]=useState([]);
  const [weekStart,setWeekStart]=useState(()=>getMonday(new Date()));
  const [tab,setTab]=useState('semana');
  const [gateOpen,setGateOpen]=useState(false);
  const [cargando,setCargando]=useState(true);
  const [guardando,setGuardando]=useState(false);
  const [progreso,setProgreso]=useState(null);
  const [aviso,setAviso]=useState(null);
  const [msg,setMsg]=useState(null);
  const toast=(m,t)=>{ setMsg({m,t}); setTimeout(()=>setMsg(null),2600); };

  useEffect(()=>{ document.documentElement.classList.toggle('light',theme==='light');
    document.querySelector('meta[name=theme-color]')?.setAttribute('content',theme==='light'?'#f4f4f5':'#0f0f0f');
    localStorage.setItem('bcops_theme',theme); },[theme]);
  const toggleTheme=()=>setTheme(t=>t==='dark'?'light':'dark');

  const weekISO=toISO(weekStart);

  /* Personal: organigrama (quién) × people de Supabase (id + PIN) */
  useEffect(()=>{
    if(!loc){ setCargando(false); return; }
    let vivo=true;
    (async()=>{
      setCargando(true);
      const [orgR, sup, cat] = await Promise.all([
        fetch('/api/personal').then(r=>r.json()).catch(()=>({ok:false,people:[]})),
        sbGet('people_public?select=id,name,role,local,station&station=in.(S,B)'),
        sbGet('salon_task_catalog?select=*&active=eq.true&order=sort_order'),
      ]);
      if(!vivo) return;

      const norm=s=>(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
      const supBy=Object.fromEntries((sup||[]).filter(p=>p.station==='S').map(p=>[norm(p.name),p]));
      setLoginPool((sup||[]).filter(p=>p.local===loc||p.local==='AMBOS'));
      setSalonPool((sup||[]).filter(p=>p.station==='S').map(p=>({
        id:p.id, name:p.name.split(' ')[0], fullName:p.name, role:p.role,
        puedeAsignar:/jefe|jefa/i.test(p.role)
      })));
      const delLocal=(orgR.people||[]).filter(p=>p.local===loc);
      const faltantes=[];
      const lista=delLocal.map(p=>{
        const s=supBy[p.key];
        if(!s) faltantes.push(p.name);
        return s ? { id:s.id, name:p.name.split(' ')[0], fullName:p.name, role:p.role, puedeAsignar:p.isJefe, pinOk:true }
                 : { id:'x_'+p.key, name:p.name.split(' ')[0], fullName:p.name, role:p.role, puedeAsignar:p.isJefe, pinOk:false };
      }).filter(p=>p.pinOk);

      setPeople(lista);
      /* El catálogo lo carga cargarCatalogo() con la RPC, que filtra por local
         y trae también las desactivadas. Esta lectura solo sirve de respaldo
         y para detectar que el SQL todavía no se corrió. */
      if (!catalogAll.length) {
        setCatalog((cat||[])
          .filter(t => !t.locals || t.locals.includes(loc))
          .map(t=>({...t, time:t.time_due||''})));
      }
      setDays(ALL_DAYS.slice(0,LOCALES[loc].openDays));

      const problemas=[];
      if(!orgR.ok) problemas.push('No pude leer el organigrama; el personal puede estar incompleto.');
      if(faltantes.length) problemas.push('Sin PIN en la base (no pueden entrar): '+faltantes.join(', ')+'.');
      if(!cat||!cat.length) problemas.push('El catálogo de tareas está vacío: falta correr schema_tareas_salon.sql en Supabase.');
      setAviso(problemas.length?problemas:null);
      setCargando(false);
    })();
    return ()=>{vivo=false};
  },[loc]);

  /* Asignación + roster + reporte de la semana */
  const cargarSemana = useCallback(async()=>{
    if(!loc) return;
    const rows = await sbGet(`salon_assignments?select=day_name,person_id,task_id&local=eq.${loc}&week_start=eq.${weekISO}`);
    const a={};
    (rows||[]).forEach(r=>{ (a[r.day_name]=a[r.day_name]||{}); (a[r.day_name][r.person_id]=a[r.day_name][r.person_id]||[]).push(r.task_id); });
    setAsign(a);
    const ros = await sbRpc('salon_week_roster_get',{p_week:weekISO,p_local:loc});
    setRosterWeek(Array.isArray(ros.data)?ros.data:[]);
    const rep = await sbRpc('salon_week_report',{p_local:loc,p_week:weekISO});
    setReporte(Array.isArray(rep.data)?rep.data:[]);
  },[loc,weekISO]);
  useEffect(()=>{ cargarSemana(); },[cargarSemana]);

  /* Guardar un día (o varios, al copiar o repartir la semana) */
  const guardar = async (day, payload) => {
    if(!user?.puedeAsignar){ toast('Solo los jefes de garzones pueden asignar','error'); return; }
    const lotes = day ? [[day,payload]] : Object.entries(payload);
    const prev = asign;
    const nuevo = {...asign};
    lotes.forEach(([d,v])=>{ nuevo[d]=v; });
    setAsign(nuevo);                       /* optimista */
    const varios = lotes.length > 1;
    if (varios) setGuardando(true);
    let i = 0;
    for (const [d,v] of lotes) {
      i++;
      if (varios) setProgreso(`Guardando ${DAY_FULL[ALL_DAYS.indexOf(d)]} · ${i} de ${lotes.length}`);
      const limpio={}; Object.entries(v).forEach(([pid,ids])=>{ if(ids&&ids.length) limpio[pid]=ids; });
      const r = await sbRpc('salon_set_day',{ p_actor:user.id, p_pin:user.pin, p_local:loc, p_week:weekISO, p_day:d, p_assign:limpio });
      if (r.error) {
        setAsign(prev); setGuardando(false); setProgreso(null);
        toast(r.error.includes('jefes')?'Solo los jefes de garzones pueden asignar':'No se pudo guardar '+DAY_FULL[ALL_DAYS.indexOf(d)],'error');
        cargarSemana();
        return;
      }
    }
    setGuardando(false); setProgreso(null);
    toast(varios ? `Semana repartida · ${lotes.length} días` : 'Guardado');
    cargarSemana();
  };

  /* Quién trabaja en este local esta semana.
     Si la semana ya tiene equipo definido manda ese; si no, el organigrama. */
  const equipo = useMemo(()=>{
    if (rosterWeek.length) {
      const by=Object.fromEntries(salonPool.map(p=>[p.id,p]));
      return rosterWeek.filter(r=>r.en_este_local)
        .map(r=>by[r.person_id] || { id:r.person_id, name:(r.name||'').split(' ')[0], fullName:r.name, role:r.role, puedeAsignar:/jefe|jefa/i.test(r.role||'') });
    }
    return people;
  },[rosterWeek,salonPool,people]);
  const rosterDefinido = rosterWeek.length > 0;

  const guardarRoster = async (ids) => {
    if(!user?.puedeAsignar){ toast('Solo los jefes de garzones pueden definir el equipo','error'); return; }
    setGuardando(true); setProgreso('Guardando el equipo de la semana…');
    const r = await sbRpc('salon_set_week_roster',{ p_actor:user.id, p_pin:user.pin, p_week:weekISO, p_local:loc, p_ids:ids });
    setGuardando(false); setProgreso(null);
    if (r.error) { toast(r.error.includes('jefes')?'Solo los jefes de garzones pueden definir el equipo':'No se pudo guardar el equipo','error'); return; }
    toast(`Equipo de la semana · ${ids.length} en ${loc}`);
    cargarSemana();
  };

  /* ── Catálogo editable desde la app ── */
  const cargarCatalogo = useCallback(async()=>{
    if(!loc) return;
    const r = await sbRpc('salon_task_catalog_all',{p_local:loc});
    if (Array.isArray(r.data)) {
      setCatalogAll(r.data);
      setCatalog(r.data.filter(t=>t.active!==false).map(t=>({...t, time:t.time_due||''})));
    }
  },[loc]);
  useEffect(()=>{ cargarCatalogo(); },[cargarCatalogo]);

  const guardarTarea = async (t) => {
    if(!user?.puedeAsignar){ toast('No tienes permiso para editar las tareas','error'); return; }
    setGuardando(true);
    const r = await sbRpc('salon_task_upsert',{
      p_actor:user.id, p_pin:user.pin, p_id:t.id||null, p_name:t.name,
      p_icon:t.icon||'checksq', p_time:t.time_due||null, p_priority:t.priority||'media',
      p_days:t.days||null, p_photo_required:t.photo_required!==false,
      p_is_break:!!t.is_break, p_locals:t.locals||['BC1','BC2'], p_sort:t.sort_order||50
    });
    setGuardando(false);
    if(r.error){ toast(r.error,'error'); return; }
    toast(t.id?'Tarea actualizada':'Tarea creada');
    cargarCatalogo(); cargarSemana();
  };

  const toggleTarea = async (t) => {
    if(!user?.puedeAsignar){ toast('No tienes permiso para editar las tareas','error'); return; }
    const activar = t.active === false;
    setGuardando(true);
    const r = await sbRpc('salon_task_set_active',{p_actor:user.id,p_pin:user.pin,p_id:t.id,p_active:activar});
    setGuardando(false);
    if(r.error){ toast(r.error,'error'); return; }
    toast(activar?'Tarea reactivada':'Tarea desactivada');
    cargarCatalogo(); cargarSemana();
  };

  const pickLocal=(id)=>{ setLoc(id); localStorage.setItem('bcops_loc',id); setUser(null); };
  const cambiarLocal=()=>{ setUser(null); setLoc(null); localStorage.removeItem('bcops_loc'); };

  if(!loc) return <LocalPicker onPick={pickLocal} theme={theme} toggleTheme={toggleTheme}/>;
  if(cargando) return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-4">
      <img src="logo.png" className="w-20 h-20 object-contain opacity-40 animate-pulse" alt=""/>
      <p className="text-[10px] font-black uppercase tracking-[0.3em] dim">Cargando</p>
    </div>
  );
  if(!user) return <Login loc={loc} people={loginPool} onLogin={setUser} onBack={cambiarLocal} theme={theme} toggleTheme={toggleTheme}/>;

  const L=LOCALES[loc];
  const esHoySemana = weekISO===toISO(getMonday(new Date()));

  return (
    <div className="min-h-screen pb-28">
      <header className="sticky top-0 z-40 border-b px-4 py-3" style={{background:'var(--bg)',borderColor:'var(--line)'}}>
        <div className="max-w-3xl mx-auto">
          <div className="flex justify-between items-center gap-2">
            <div className="flex items-center gap-2.5 min-w-0">
              <img src="logo.png" className="w-8 h-8 object-contain shrink-0" alt=""/>
              <div className="min-w-0">
                <h1 className="text-sm font-black uppercase tracking-tight leading-none truncate">{L.name}</h1>
                <p className="text-[9px] font-bold gold uppercase tracking-wider mt-0.5">
                  {user.name}{user.puedeAsignar?' · puede asignar':' · solo lectura'}
                </p>
              </div>
            </div>
            <div className="flex gap-1 shrink-0">
              <button onClick={toggleTheme} className="p-2 rounded-lg dim"><Icon name={theme==='dark'?'sun':'moon'} size={17}/></button>
              <button onClick={cambiarLocal} className="p-2 rounded-lg dim"><Icon name="home" size={17}/></button>
              <button onClick={()=>setUser(null)} className="p-2 rounded-lg dim"><Icon name="logout" size={17}/></button>
            </div>
          </div>
          <div className="flex items-center justify-between mt-2.5">
            <button onClick={()=>{const d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d);}} className="px-2 dim text-lg font-bold">‹</button>
            <button onClick={()=>setWeekStart(getMonday(new Date()))} className="flex items-center gap-1.5 dim">
              <Icon name="calendar" size={12}/>
              <span className="text-[10px] font-black uppercase tracking-wider">Semana del {fmtDate(weekStart)}</span>
              {!esHoySemana && <span className="text-[8px] font-black bg-amber-500/20 text-amber-600 px-1.5 py-0.5 rounded uppercase">Otra semana</span>}
            </button>
            <button onClick={()=>{const d=new Date(weekStart);d.setDate(d.getDate()+7);setWeekStart(d);}} className="px-2 dim text-lg font-bold">›</button>
          </div>
        </div>
      </header>

      <main className="max-w-3xl mx-auto p-3 space-y-3">
        {aviso && (
          <div className="bg-rose-500/10 border border-rose-500/30 rounded-xl p-3 space-y-1">
            {aviso.map((a,i)=><p key={i} className="text-[10px] font-bold text-rose-500 flex gap-1.5"><Icon name="alert" size={12}/> {a}</p>)}
          </div>
        )}
        {(!rosterDefinido && esHoySemana) ? (
        <div className="space-y-3 fade-in">
          <div className="rounded-2xl border p-5" style={{background:'rgba(212,168,67,.08)',borderColor:'var(--gold)'}}>
            <p className="text-[10px] font-black uppercase tracking-wider gold flex items-center gap-1.5">
              <Icon name="users" size={13}/> Primero: el equipo de la semana
            </p>
            <p className="text-[15px] font-black mt-2">¿Quiénes trabajan en {LOCALES[loc].name} esta semana?</p>
            <p className="text-[11px] dim font-medium mt-1.5">
              Es el primer paso de la semana. Sin esto no se puede asignar ni controlar: las tareas se repartirían entre gente que no está en el local.
            </p>
            {user.puedeAsignar ? (
              <button onClick={()=>setGateOpen(true)}
                className="w-full mt-4 py-3 rounded-xl bgold text-black text-[12px] font-black uppercase tracking-wider">
                Definir el equipo de la semana
              </button>
            ) : (
              <p className="text-[11px] font-bold mt-4">Lo define el jefe de garzones. Avísale para poder empezar la semana.</p>
            )}
          </div>
          <button onClick={()=>{const d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d);}}
            className="w-full py-2.5 rounded-xl card border text-[10px] font-black uppercase tracking-wider dim">
            Ver la semana anterior
          </button>
        </div>
        ) : (<>
        {tab==='semana'  && <SemanaView loc={loc} catalog={catalog} people={equipo} days={days} weekStart={weekStart}
                              asign={asign} guardar={guardar} puedeAsignar={!!user.puedeAsignar} toast={toast}
                              guardando={guardando} progreso={progreso}
                              salonPool={salonPool} rosterWeek={rosterWeek} rosterDefinido={rosterDefinido}
                              guardarRoster={guardarRoster} userId={user.id}/>}
        {tab==='control' && <ControlView loc={loc} weekStart={weekStart} days={days} reporte={reporte} toast={toast}/>}
        {tab==='tareas'  && <TareasView loc={loc} catalogAll={catalogAll.length?catalogAll:catalog} days={days}
                              puedeEditar={!!user.puedeAsignar} guardando={guardando}
                              onSave={guardarTarea} onToggleActive={toggleTarea}/>}
        </>)}
        {gateOpen && (
          <RosterSheet loc={loc} salonPool={salonPool} rosterWeek={rosterWeek} weekStart={weekStart} userId={user.id}
            onClose={()=>setGateOpen(false)}
            onSave={(ids)=>{ setGateOpen(false); guardarRoster(ids); }}/>
        )}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-40 border-t px-2 py-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]" style={{background:'var(--card)',borderColor:'var(--line)',display:(!rosterDefinido&&esHoySemana)?'none':'block'}}>
        <div className="max-w-3xl mx-auto grid grid-cols-3 gap-1">
          {[['semana','Asignar','grid'],['control','Control','chart'],['tareas','Tareas','list']].map(([k,l,ic])=>(
            <button key={k} onClick={()=>setTab(k)} className={`flex flex-col items-center gap-1 py-2 rounded-xl ${tab===k?'bgold text-black':'dim'}`}>
              <Icon name={ic} size={17}/>
              <span className="text-[8px] font-black uppercase tracking-wider">{l}</span>
            </button>
          ))}
        </div>
      </nav>

      <Toast msg={msg?.m} tipo={msg?.t}/>

      <footer className="mt-6 text-center opacity-30 pb-2">
        <p className="text-[8px] font-black uppercase tracking-[0.4em]">Black Chicken · Planificación de Salón 2026</p>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
